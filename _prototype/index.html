<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>mReport — Parish Report Extractor</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --good: #22c55e;
    --bad: #ef4444;
    --warn: #f59e0b;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
  }
  header .sub { color: var(--muted); font-size: 13px; }
  main { padding: 32px; max-width: 1100px; margin: 0 auto; }
  .drop {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--panel);
  }
  .drop.drag { border-color: var(--accent); background: #1e3a4a; }
  .drop p { margin: 8px 0; }
  .drop .hint { color: var(--muted); font-size: 13px; }
  input[type=file] { display: none; }
  .actions {
    margin-top: 16px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  button {
    background: var(--accent);
    border: none;
    color: #0f172a;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  button:hover { opacity: 0.9; }
  .report { margin-top: 32px; }
  .report h2 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 24px 0 8px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  th, td {
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  th {
    background: var(--panel-2);
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.06em;
  }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.muted { color: #475569; }
  td.flag, th.flag { text-align: center; }
  /* ---- Lucide icon defaults ---- */
  .lucide-icon {
    display: inline-block;
    width: 16px;
    height: 16px;
    vertical-align: -3px;
    flex-shrink: 0;
  }
  .lucide-icon.size-12 { width: 12px; height: 12px; vertical-align: -2px; }
  .lucide-icon.size-14 { width: 14px; height: 14px; vertical-align: -2px; }
  .lucide-icon.size-18 { width: 18px; height: 18px; vertical-align: -4px; }
  .lucide-icon.size-20 { width: 20px; height: 20px; vertical-align: -4px; }
  .lucide-icon.size-24 { width: 24px; height: 24px; vertical-align: -5px; }
  .lucide-icon.size-32 { width: 32px; height: 32px; vertical-align: -7px; }
  /* When the icon is the only content of its container (e.g. button or chip), strip the inline-baseline offset */
  .lucide-icon.no-offset { vertical-align: middle; }
  .buildup {
    background: var(--panel);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 8px;
  }
  .buildup .field { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .buildup .formula {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
    word-break: break-word;
  }
  .buildup .formula .zero { color: #475569; }
  .buildup .formula .op { color: var(--muted); margin: 0 4px; }
  .buildup .formula .label { color: var(--muted); font-size: 11px; vertical-align: super; margin-left: 2px; }
  .buildup .formula .equals { color: var(--accent); font-weight: 600; }
  .buildup .result { font-weight: 700; color: var(--good); }
  details.section {
    margin-top: 24px;
    background: var(--panel);
    border-radius: 10px;
    padding: 12px 20px;
    border: 1px solid var(--border);
  }
  details.section > summary {
    cursor: pointer;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
    list-style: none;
    padding: 6px 0;
    user-select: none;
  }
  details.section > summary::-webkit-details-marker { display: none; }
  details.section > summary::before {
    content: "▸ ";
    color: var(--accent);
    display: inline-block;
    transition: transform 0.15s;
    margin-right: 4px;
  }
  details.section[open] > summary::before { transform: rotate(90deg); }
  details.section > summary .badge {
    background: var(--panel-2);
    color: var(--text);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    margin-left: 8px;
    text-transform: none;
    letter-spacing: 0;
    font-weight: 500;
  }
  details.section > summary .badge.good { background: #14532d; color: var(--good); }
  details.section > summary .badge.bad { background: #4c1d1d; color: var(--bad); }
  details.section > summary .badge.warn { background: #3a2e1a; color: var(--warn); }
  details.section .body { margin-top: 12px; }
  .sanity { display: grid; gap: 8px; }
  .sanity .item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 6px;
    background: var(--panel-2);
    font-size: 13px;
  }
  .sanity .item .icon { font-size: 16px; line-height: 1; flex-shrink: 0; }
  .sanity .item.ok .icon { color: var(--good); }
  .sanity .item.warn .icon { color: var(--warn); }
  .sanity .item.fail .icon { color: var(--bad); }
  .sanity .item .detail { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .pos { color: var(--good); font-weight: 600; }
  .neg { color: var(--bad); font-weight: 600; }
  .warn-row td { background: #3a2e1a; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .err {
    background: #3a1a1a;
    border: 1px solid var(--bad);
    color: #fecaca;
    padding: 12px 16px;
    border-radius: 8px;
    margin-top: 16px;
    font-size: 14px;
  }
  .summary {
    margin-top: 24px;
    padding: 16px 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .summary.ok { background: #052e1a; border-color: var(--good); }
  .summary.bad { background: #3a1a1a; border-color: var(--bad); }
  .summary.partial { background: #3a2e1a; border-color: var(--warn); }
  .summary .title { font-weight: 700; font-size: 16px; }
  .summary .ok .title { color: var(--good); }
  .summary .stats { color: var(--muted); font-size: 13px; }
  .summary ul { margin: 8px 0 0; padding-left: 20px; font-size: 13px; }
  .summary ul li { margin: 2px 0; }
  .summary-detail { width: 100%; margin-top: 4px; }
  /* ---- Outdated-template warning ---- */
  .tw {
    margin: 24px 0;
    border-radius: 14px;
    padding: 28px 32px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .tw .variant-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    opacity: 0.7;
    margin-bottom: 4px;
  }
  .tw header { display: flex; align-items: flex-start; gap: 14px; }
  .tw .icon-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .tw .title {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 4px;
  }
  .tw .subtitle { font-size: 14px; line-height: 1.5; opacity: 0.85; }
  .tw .detail-card {
    background: rgba(0,0,0,0.25);
    border-radius: 10px;
    padding: 16px 20px;
    border-left: 4px solid currentColor;
  }
  .tw .detail-card .detail-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.7;
    margin-bottom: 10px;
  }
  .tw .issue {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .tw .issue:last-child { border-bottom: none; padding-bottom: 0; }
  .tw .issue:first-child { padding-top: 0; }
  .tw .issue-title { font-weight: 700; font-size: 14px; }
  .tw .rate-badges {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: 13px;
  }
  .tw .rate-badge {
    padding: 3px 8px;
    border-radius: 4px;
    font-weight: 700;
  }
  .tw .rate-badge.bad { background: rgba(239, 68, 68, 0.18); color: #fca5a5; text-decoration: line-through; }
  .tw .rate-badge.good { background: rgba(34, 197, 94, 0.18); color: #86efac; }
  .tw .rate-arrow { opacity: 0.5; }
  .tw .issue-meta { font-size: 12px; opacity: 0.7; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; }
  .tw .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 4px;
  }
  .tw .btn {
    border: none;
    padding: 11px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: opacity 0.15s, transform 0.1s;
  }
  .tw .btn:hover { opacity: 0.9; }
  .tw .btn:active { transform: translateY(1px); }
  .tw .btn-secondary {
    background: transparent;
    border: 1px solid currentColor;
    color: inherit;
  }
  .tw.amber { background: linear-gradient(135deg, #2a1f0a 0%, #1f1607 100%); color: #fde68a; border: 1px solid #92400e; }
  .tw.amber .icon-circle { background: #78350f; color: #fbbf24; }
  .tw.amber .title { color: #fef3c7; }
  .tw.amber .detail-card { color: #f59e0b; }
  .tw.amber .detail-card .issue-title { color: #fef3c7; }
  .tw.amber .detail-card .issue-meta { color: #fde68a; opacity: 0.65; }
  .tw.amber .btn-primary { background: #f59e0b; color: #1f1300; }
  .check-tag {
    display: inline-block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 1px 6px;
    border-radius: 3px;
    margin-right: 6px;
    font-weight: 600;
  }
  .check-tag.template { background: #3a2e1a; color: var(--warn); }
  .check-tag.preparer { background: #4c1d1d; color: var(--bad); }

  /* ---- Rich failure cards ---- */
  .failure-list { display: grid; gap: 12px; margin-top: 14px; }
  .failure-card {
    border-radius: 10px;
    padding: 18px 20px;
    border: 1px solid;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .failure-card.fail { background: #2a0e0e; border-color: var(--bad); color: #fecaca; }
  .failure-card.warn { background: #2a1f0a; border-color: var(--warn); color: #fde68a; }
  .failure-card.info { background: #0e1f2a; border-color: var(--accent); color: #bae6fd; }

  /* Header: cell address + field name as the card subject */
  .failure-card .card-subject {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .failure-card .subject-text {
    font-weight: 700;
    font-size: 15px;
    color: inherit;
    filter: brightness(1.2);
  }
  .failure-card .subject-text .cell-ref {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    background: rgba(0,0,0,0.3);
    padding: 2px 8px;
    border-radius: 4px;
    cursor: pointer;
    user-select: all;
    margin-right: 6px;
    font-size: 13px;
  }
  .failure-card .subject-text .cell-ref:hover { background: rgba(0,0,0,0.5); }
  .failure-card .subtype-chip {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 12px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.08);
    font-weight: 500;
    white-space: nowrap;
  }

  /* Body content shared utilities */
  .failure-card .card-cause {
    font-size: 12px;
    line-height: 1.5;
    opacity: 0.7;
    font-style: italic;
  }
  .failure-card .card-cause:before { content: "Probable cause: "; opacity: 0.7; font-style: normal; font-weight: 600; }

  .failure-card.layout-c .card-headline {
    font-size: 14px;
    line-height: 1.5;
  }
  .failure-card.layout-c .compare-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 6px;
  }
  .failure-card.layout-c .compare-list li {
    display: grid;
    grid-template-columns: 88px 1fr;
    gap: 10px;
    font-size: 14px;
    align-items: baseline;
  }
  .failure-card.layout-c .compare-list .li-label {
    opacity: 0.7;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
  }
  .failure-card.layout-c .compare-list .li-value {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }
  .failure-card.layout-c .compare-list .li-source {
    opacity: 0.65;
    font-weight: 400;
    font-size: 13px;
    margin-left: 8px;
  }

  /* Fix CTA — shared across layouts */
  .failure-card .card-fix {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding-top: 4px;
  }
  .failure-card .fix-text {
    font-size: 13px;
    opacity: 0.85;
    font-style: italic;
  }
  .failure-card .fix-btn {
    border: none;
    padding: 9px 16px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: opacity 0.15s, transform 0.1s;
  }
  .failure-card .fix-btn:hover { opacity: 0.9; }
  .failure-card .fix-btn:active { transform: translateY(1px); }
  .failure-card.warn .fix-btn { background: var(--warn); color: #1f1300; }
  .failure-card.info .fix-btn { background: var(--accent); color: #061a26; }
  .failure-card .fix-btn[disabled] { opacity: 0.5; cursor: not-allowed; transform: none; }
  .copy-toast {
    display: inline-block;
    margin-left: 6px;
    font-size: 11px;
    color: var(--good);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .copy-toast.show { opacity: 1; }


  /* ---- Compact-summary view (100% clean reports) ---- */
  .compact-summary {
    margin-top: 24px;
    padding: 32px;
    border-radius: 14px;
    background: linear-gradient(135deg, #052e1a 0%, #04200f 100%);
    border: 1px solid var(--good);
    color: #d1fae5;
  }
  .compact-summary .compact-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }
  .compact-summary .compact-icon {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--good);
    color: #052e1a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 800;
    flex-shrink: 0;
  }
  .compact-summary .compact-title {
    font-size: 22px;
    font-weight: 700;
    color: #f0fdf4;
    line-height: 1.2;
    margin-bottom: 4px;
  }
  .compact-summary .compact-subtitle {
    font-size: 14px;
    color: #bbf7d0;
    opacity: 0.85;
  }
  .compact-summary .compact-checklist {
    display: grid;
    gap: 6px;
    margin-bottom: 20px;
  }
  .compact-summary .compact-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    background: rgba(0,0,0,0.25);
    border-radius: 8px;
    font-size: 14px;
  }
  .compact-summary .compact-row .check {
    color: var(--good);
    font-size: 20px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .compact-summary .compact-row .row-label {
    flex: 1;
    color: #f0fdf4;
    font-weight: 600;
  }
  .compact-summary .compact-row .row-detail {
    color: #bbf7d0;
    opacity: 0.7;
    font-size: 13px;
  }
  .compact-summary .compact-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .compact-summary .compact-btn {
    background: var(--good);
    color: #052e1a;
    border: none;
    padding: 12px 22px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .compact-summary .compact-btn:hover { opacity: 0.9; }
  .compact-summary .compact-btn-secondary {
    background: transparent;
    border: 1px solid #bbf7d0;
    color: #bbf7d0;
  }

  /* ---- Fixes Applied log ---- */
  .fixes-log {
    margin-top: 24px;
    padding: 14px 18px;
    background: #052e1a;
    border: 1px solid var(--good);
    border-radius: 10px;
    color: #bbf7d0;
  }
  .fixes-log .log-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--good);
    margin-bottom: 10px;
  }
  .fixes-log .log-title .count {
    background: var(--good);
    color: #052e1a;
    font-size: 11px;
    padding: 1px 8px;
    border-radius: 10px;
  }
  .fixes-log .log-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 12px;
    align-items: baseline;
    padding: 6px 0;
    border-bottom: 1px solid rgba(34, 197, 94, 0.15);
    font-size: 13px;
  }
  .fixes-log .log-row:last-child { border-bottom: none; }
  .fixes-log .log-time {
    font-variant-numeric: tabular-nums;
    color: rgba(187, 247, 208, 0.55);
    font-size: 11px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  .fixes-log .log-detail {
    color: #d1fae5;
  }
  .fixes-log .log-detail strong { color: #f0fdf4; font-weight: 600; }
  .fixes-log .log-cell {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    background: rgba(0,0,0,0.25);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 11px;
  }
  .fixes-log .log-change {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: 12px;
  }
  .fixes-log .log-change .old {
    color: rgba(252, 165, 165, 0.7);
    text-decoration: line-through;
  }
  .fixes-log .log-change .arrow { opacity: 0.5; margin: 0 6px; }
  .fixes-log .log-change .new {
    color: var(--good);
    font-weight: 700;
  }
  .ok-pill { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; background: #14532d; color: var(--good); margin-left: 8px; }
  .bad-pill { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; background: #4c1d1d; color: var(--bad); margin-left: 8px; }
  footer { color: var(--muted); font-size: 12px; padding: 24px 32px; text-align: center; border-top: 1px solid var(--border); margin-top: 48px; }
  details { margin-top: 12px; color: var(--muted); font-size: 13px; }
  details pre { background: #020617; padding: 12px; border-radius: 6px; overflow: auto; max-height: 300px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>mReport</h1>
    <div class="sub">Parish report extractor — drop an .xlsx, get the structured summary.</div>
  </div>
  <div class="sub" id="filename"></div>
</header>

<main>
  <label class="drop" id="drop">
    <p><strong>Drop a parish report .xlsx here</strong></p>
    <p class="hint">or click to browse · runs entirely in your browser, no upload</p>
    <input type="file" id="file" accept=".xlsx,.xls" />
  </label>

  <div id="errors"></div>

  <div id="report" class="report"></div>
</main>

<footer>mReport prototype · client-side only · <span id="version">v0.1</span> · <a href="?demo=errors" style="color:var(--muted);text-decoration:underline">error showcase</a></footer>

<script>
// ============================================================
//  CONFIG
// ============================================================

// URL of the canonical parish-report template. Update when you have the link.
// The "outdated template" banner points users here.
const CORRECT_TEMPLATE_URL = "https://example.com/CORRECT-TEMPLATE-LINK-PLACEHOLDER";

// Canonical remittance percentage rules. Used both for validation and for detecting
// templates whose built-in formulas use different rates.
const CANONICAL_RULES = {
  regional: { offering: 0.05, tithe: 0.20 },
  parishOps: { tithe: 0.55, offering: 0.95, thanksgiving: 0.30 },
  pastorAllow: { tithe: 0.20, thanksgiving: 0.70 },
  provincial: { tithe: 0.05 },
};

// Per-section severity. Edit this map to re-grade what counts as a hard failure
// vs a warning, without touching the validation logic.
//   "fail" = red, money/allocation level — must be fixed
//   "warn" = amber, data is intact but totals are out of sync — should be fixed
//   "info" = blue, cosmetic / acceptable rounding
// Falls back to "_default" if a section isn't listed.
const FIELD_SEVERITY = {
  // Money / allocation — always fail
  "Allocation Reconciliation": "fail",
  "Regional Remittance":       "fail",
  "Parish Operations":         "fail",
  "Pastor Allowance":          "fail",
  "Provincial Remittance":     "fail",
  "Weekly Totals":             "fail",
  "Per-Date Money":            "fail",

  // Parish Records — fail for monetary totals, warn for averages (rounding common)
  "Parish Records":            "fail", // overridden per-label below for averages
  "Per-Date Attendance":       "warn",

  // Statistics — warning (data intact, totals row often forgotten)
  "Statistics":                "warn",

  "_default":                  "fail",
};

// Per-LABEL severity overrides (more specific than per-section).
// Each entry: { pattern: RegExp matched against check.label, severity }.
// First match wins. Used when the same section has fields with different severities.
const LABEL_SEVERITY = [
  // Demographic averages tolerate small rounding differences
  { pattern: /average/i, severity: "warn" },
];

// ============================================================
//  PARSER — label-tolerant
// ============================================================

const NUM = (v) => {
  if (v === null || v === undefined || v === "") return 0;
  const n = typeof v === "number" ? v : parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
  return isNaN(n) ? 0 : n;
};

const round2 = (n) => Math.round(n * 100) / 100;

// Find a cell whose value matches `pattern` (string substring or RegExp), case-insensitive.
// Returns {r, c, value} or null. Searches the first sheet by default.
function findCell(sheet, pattern, opts = {}) {
  const range = XLSX.utils.decode_range(sheet["!ref"]);
  const isRe = pattern instanceof RegExp;
  const startR = opts.startR ?? range.s.r;
  const endR = opts.endR ?? range.e.r;
  for (let r = startR; r <= endR; r++) {
    for (let c = range.s.c; c <= range.e.c; c++) {
      const cell = sheet[XLSX.utils.encode_cell({ r, c })];
      if (!cell || cell.v == null) continue;
      const s = String(cell.v).trim();
      if (!s) continue;
      if (isRe ? pattern.test(s) : s.toLowerCase().includes(String(pattern).toLowerCase())) {
        return { r, c, value: cell.v, raw: s };
      }
    }
  }
  return null;
}

function findAllCells(sheet, pattern) {
  const range = XLSX.utils.decode_range(sheet["!ref"]);
  const isRe = pattern instanceof RegExp;
  const out = [];
  for (let r = range.s.r; r <= range.e.r; r++) {
    for (let c = range.s.c; c <= range.e.c; c++) {
      const cell = sheet[XLSX.utils.encode_cell({ r, c })];
      if (!cell || cell.v == null) continue;
      const s = String(cell.v).trim();
      if (!s) continue;
      if (isRe ? pattern.test(s) : s.toLowerCase() === String(pattern).toLowerCase()) {
        out.push({ r, c, value: cell.v, raw: s });
      }
    }
  }
  return out;
}

// Walk right from (r, c) collecting the next non-empty cell as the "value to the right of the label".
// IMPORTANT: this stops at the next non-empty cell on the same row — if other LABELS sit on
// the same row (e.g., "Name Of Parish" at F3 and "Pastor In Charge" at K3 with empty cells
// between them), this will incorrectly return the next label as the value. Use
// valueForHeaderLabel() instead for header-row labels whose values sit BELOW the label.
function valueRightOf(sheet, label, opts = {}) {
  const hit = findCell(sheet, label, opts);
  if (!hit) return null;
  const range = XLSX.utils.decode_range(sheet["!ref"]);
  for (let c = hit.c + 1; c <= range.e.c; c++) {
    const cell = sheet[XLSX.utils.encode_cell({ r: hit.r, c })];
    if (cell && cell.v != null && String(cell.v).trim() !== "") {
      return cell.v;
    }
  }
  return null;
}

// Resolve the value for a header-row label by checking the cell DIRECTLY BELOW first
// (the most common parish-report layout: labels in row 3, values in row 4). Falls back
// to right-walking if the cell below is empty. Avoids the "next label on the same row"
// bug where, e.g., F3="Name Of Parish" and K3="Pastor In Charge" both sit on the same row.
function valueForHeaderLabel(sheet, label) {
  const hit = findCell(sheet, label);
  if (!hit) return null;
  // 1. Try the cell directly below
  const below = sheet[XLSX.utils.encode_cell({ r: hit.r + 1, c: hit.c })];
  if (below && below.v != null && String(below.v).trim() !== "") {
    return below.v;
  }
  // 2. Fall back to right-walking (legacy layouts where label and value share a row)
  return valueRightOf(sheet, label);
}

// Scan every cell in the sheet for a string matching `pattern`. Returns the first
// match (trimmed) or null. Used as a fallback when label-based lookups (e.g.,
// valueRightOf("Email")) come up empty because of template variation.
function scanSheetFor(sheet, pattern) {
  if (!sheet || !sheet["!ref"]) return null;
  const range = XLSX.utils.decode_range(sheet["!ref"]);
  for (let r = range.s.r; r <= range.e.r; r++) {
    for (let c = range.s.c; c <= range.e.c; c++) {
      const cell = sheet[XLSX.utils.encode_cell({ r, c })];
      if (!cell || cell.v == null) continue;
      const s = String(cell.v).trim();
      if (!s) continue;
      if (pattern.test(s)) return s;
    }
  }
  return null;
}

// Email fallback: anything matching a basic email shape.
function findEmailInSheet(sheet) {
  return scanSheetFor(sheet, /^[\w.+-]+@[\w-]+\.[\w.-]+$/);
}

// Mobile fallback: phone-shaped strings — 7+ digits with optional +, spaces, dashes,
// parentheses. Avoid matching Excel serial dates by requiring at least one non-digit
// formatting char OR a leading + OR a length of >= 9.
function findMobileInSheet(sheet) {
  if (!sheet || !sheet["!ref"]) return null;
  const range = XLSX.utils.decode_range(sheet["!ref"]);
  for (let r = range.s.r; r <= range.e.r; r++) {
    for (let c = range.s.c; c <= range.e.c; c++) {
      const cell = sheet[XLSX.utils.encode_cell({ r, c })];
      if (!cell || cell.v == null) continue;
      const s = String(cell.v).trim();
      if (!s) continue;
      // Require phone-y characters and at least 7 digits total.
      if (!/^[\+\d\s\-().]+$/.test(s)) continue;
      const digitCount = (s.match(/\d/g) || []).length;
      if (digitCount < 7) continue;
      // Reject pure-numeric cells under 7 digits or that look like years/serials.
      const looksFormatted = /[\s\-+().]/.test(s);
      if (!looksFormatted && digitCount < 9) continue;
      return s;
    }
  }
  return null;
}

function excelDateToJS(serial) {
  if (serial instanceof Date) return serial;
  if (typeof serial === "number") {
    // Excel serial → local-midnight Date (no timezone shift). Each integer is a calendar day.
    const days = Math.floor(serial - 25569);
    const d = new Date(1970, 0, 1);
    d.setDate(d.getDate() + days);
    return d;
  }
  if (typeof serial === "string") {
    return parseStringDate(serial);
  }
  return null;
}

// Parse common date string formats found in parish reports.
// Supports: DD.MM.YYYY (German), DD/MM/YYYY, MM/DD/YYYY, YYYY-MM-DD.
// Returns a local-midnight Date, or null if unparseable.
function parseStringDate(s) {
  if (!s) return null;
  const trimmed = String(s).trim();
  // ISO YYYY-MM-DD
  let m = trimmed.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  // DD.MM.YYYY (German format used in old template)
  m = trimmed.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);
  if (m) {
    const year = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]);
    return new Date(year, Number(m[2]) - 1, Number(m[1]));
  }
  // DD/MM/YYYY or MM/DD/YYYY — assume DD/MM since the template is European.
  m = trimmed.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) {
    const year = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]);
    return new Date(year, Number(m[2]) - 1, Number(m[1]));
  }
  // Fallback: native Date constructor.
  const d = new Date(trimmed);
  return isNaN(d) ? null : d;
}

// Format a date as YYYY-MM-DD using LOCAL components (not UTC) to avoid off-by-one.
function ymd(d) {
  if (!(d instanceof Date) || isNaN(d)) return null;
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${dd}`;
}

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function detectMonthYear(sheet) {
  // Strategy: find all dates that look like Sunday entries (in the WEEK blocks),
  // pick the most common month/year among them.
  const range = XLSX.utils.decode_range(sheet["!ref"]);
  const dates = [];
  for (let r = range.s.r; r <= range.e.r; r++) {
    for (let c = range.s.c; c <= range.e.c; c++) {
      const cell = sheet[XLSX.utils.encode_cell({ r, c })];
      if (!cell) continue;
      // ONLY treat cells as dates when they're actually typed as dates by Excel/SheetJS.
      // Earlier versions converted every numeric cell via excelDateToJS — that caused
      // attendance counts (e.g. M8=1) to be misread as 1899-12-31, which then outvoted
      // the real Sunday dates and produced "March 1900" as the report month.
      let d = null;
      if (cell.t === "d" || cell.v instanceof Date) {
        const raw = cell.v instanceof Date ? cell.v : new Date(cell.v);
        if (!isNaN(raw)) {
          // Re-anchor UTC-midnight Date to local components (SheetJS returns UTC for serials).
          d = new Date(raw.getUTCFullYear(), raw.getUTCMonth(), raw.getUTCDate());
        }
      } else if (cell.t === "n" && cell.w && /\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/.test(cell.w)) {
        const raw = new Date(cell.w);
        if (!isNaN(raw)) d = raw;
      } else if (cell.t === "s" && typeof cell.v === "string") {
        // Old templates store dates as text (e.g., "05.10.2025"). Only count strings
        // that look like dates so we don't pull in random text cells.
        if (/^\d{1,2}[.\/\-]\d{1,2}[.\/\-]\d{2,4}$/.test(cell.v.trim()) || /^\d{4}-\d{1,2}-\d{1,2}$/.test(cell.v.trim())) {
          d = parseStringDate(cell.v);
        }
      }
      // Defensive guard: reject any date before year 2000. Excel's date epoch starts at 1900,
      // so any small numeric stray that slips through here would land in early 1900s and skew
      // the tally. No real parish report is from before 2000.
      if (d && d.getFullYear() >= 2000) {
        dates.push(d);
      }
    }
  }
  // Look only at dates that fall on a Sunday (these are the WEEK markers in the template)
  const sundays = dates.filter((d) => d.getDay() === 0);
  const pool = sundays.length ? sundays : dates;
  if (!pool.length) return { month: null, year: null, label: "Unknown" };
  // Tally (year, month) frequency
  const tally = {};
  for (const d of pool) {
    const key = `${d.getFullYear()}-${d.getMonth()}`;
    tally[key] = (tally[key] || 0) + 1;
  }
  const [bestKey] = Object.entries(tally).sort((a, b) => b[1] - a[1])[0];
  const [year, month] = bestKey.split("-").map(Number);
  return { month, year, label: `${MONTHS[month]} ${year}` };
}

// ============================================================
// Per-date extraction
// ============================================================
// For every WEEK block, locate its column header row (Date|Days|Men|Women|Children|Total|Offering|Tithe|Tnx_Giving|Others|Total),
// then walk every row below until the next "Total" line, capturing each dated row.
function extractPerDateRows(sheet) {
  const range = XLSX.utils.decode_range(sheet["!ref"]);
  const headerHits = findAllCells(sheet, /^offering$/i); // every WEEK block has its own "Offering" header
  const rows = [];

  for (const hit of headerHits) {
    // Map columns on this header row.
    const cols = {};
    for (let c = range.s.c; c <= range.e.c; c++) {
      const cell = sheet[XLSX.utils.encode_cell({ r: hit.r, c })];
      if (!cell || cell.v == null) continue;
      const s = String(cell.v).trim().toLowerCase();
      if (s === "date") cols.date = c;
      else if (s === "days") cols.days = c;
      else if (s === "men") cols.men = c;
      else if (s === "women") cols.women = c;
      else if (s === "children") cols.children = c;
      else if (s === "total") cols.totalAttendance = c; // first "Total" within the attendance group
      else if (s === "offering") cols.offering = c;
      else if (s === "tithe") cols.tithe = c;
      else if (/tnx[_\s]?giving|thanksgiving|tnx giving/.test(s)) cols.thanksgiving = c;
      else if (s === "others") cols.others = c;
      else if (/^total\s*\(?€\)?$/.test(s)) cols.totalMoney = c;
    }

    // Walk down up to ~8 rows looking for dated entries (Sunday + Midweek1/2/3 typically).
    for (let r = hit.r + 1; r <= Math.min(hit.r + 8, range.e.r); r++) {
      const dayCell = cols.days != null ? sheet[XLSX.utils.encode_cell({ r, c: cols.days })] : null;
      const dateCell = cols.date != null ? sheet[XLSX.utils.encode_cell({ r, c: cols.date })] : null;
      const dayLabel = dayCell && dayCell.v != null ? String(dayCell.v).trim() : "";

      // Stop at end-of-section markers. The "Total" / "Monthly Average" labels can appear in either
      // the Date column (B) OR the Days column (C) depending on the template, so we sweep all
      // cells on this row and break if we see any of these section-terminator labels.
      let isSectionEnd = false;
      for (let cc = range.s.c; cc <= range.e.c; cc++) {
        const cv = sheet[XLSX.utils.encode_cell({ r, c: cc })];
        if (!cv || cv.v == null) continue;
        const s = String(cv.v).trim().toLowerCase();
        if (s === "total" || s === "monthly average" || /^week\s*\d+/i.test(s)) {
          isSectionEnd = true;
          break;
        }
      }
      if (isSectionEnd) break;

      // Include rows with EITHER a date OR a day label (so empty midweek rows still appear if labelled).
      const hasDate = dateCell && dateCell.v != null;
      if (!hasDate && !dayLabel) continue;

      const get = (key) => {
        if (cols[key] == null) return null;
        const cell = sheet[XLSX.utils.encode_cell({ r, c: cols[key] })];
        return cell && cell.v != null ? cell.v : null;
      };

      let dateVal = get("date");
      if (typeof dateVal === "number") {
        const d = excelDateToJS(dateVal);
        if (d) dateVal = d;
      } else if (dateVal instanceof Date) {
        // SheetJS gives UTC-midnight; re-anchor to local components.
        dateVal = new Date(dateVal.getUTCFullYear(), dateVal.getUTCMonth(), dateVal.getUTCDate());
      } else if (typeof dateVal === "string" && dateVal.trim()) {
        // Old templates store dates as text (e.g., "05.10.2025" in DD.MM.YYYY format).
        const d = parseStringDate(dateVal);
        if (d) dateVal = d;
      }
      // Normalize to local YYYY-MM-DD (avoid UTC shift that pushes Sunday Nov 2 -> Nov 1).
      const dateLocal = dateVal instanceof Date ? ymd(dateVal) : (dateVal || null);

      const men = NUM(get("men"));
      const women = NUM(get("women"));
      const children = NUM(get("children"));
      const totalAtt = get("totalAttendance"); // may be null/0 for blank midweek rows
      const offering = NUM(get("offering"));
      const tithe = NUM(get("tithe"));
      const thanksgiving = NUM(get("thanksgiving"));
      const others = NUM(get("others"));
      const totalMoney = get("totalMoney");

      // Skip rows that are entirely blank (no values, no date, no day label).
      const allBlank = !hasDate && !dayLabel && men + women + children + offering + tithe + thanksgiving + others === 0;
      if (allBlank) continue;

      rows.push({
        row: r,
        day: dayLabel,
        date: dateLocal,
        attendance: {
          men, women, children,
          totalReported: totalAtt != null ? NUM(totalAtt) : null,
          totalCalculated: men + women + children,
          validated: totalAtt != null ? Math.abs(NUM(totalAtt) - (men + women + children)) < 0.01 : null,
        },
        money: {
          offering, tithe, thanksgiving, others,
          totalReported: totalMoney != null ? NUM(totalMoney) : null,
          totalCalculated: round2(offering + tithe + thanksgiving + others),
          validated: totalMoney != null ? Math.abs(NUM(totalMoney) - (offering + tithe + thanksgiving + others)) < 0.01 : null,
        },
        // True if this row had any non-zero value (used for "Monthly Average" denominator decisions).
        hasAttendance: men + women + children > 0,
        hasMoney: offering + tithe + thanksgiving + others > 0,
      });
    }
  }
  return rows;
}

// Statistics column labels (M–X). Each parish report has 12 stat fields per week.
const STAT_FIELDS = [
  { key: "births", label: "Births" },
  { key: "marriages", label: "Marriages" },
  { key: "deaths", label: "Deaths" },
  { key: "converts", label: "Converts" },
  { key: "baptisms", label: "Baptisms" },
  { key: "workers", label: "Workers" },
  { key: "ministers", label: "Ministers" },
  { key: "disciplinary", label: "Disciplinary" },
  { key: "newParishes", label: "New Parishes" },
  { key: "newNations", label: "New Nations" },
  { key: "churchDedication", label: "Church Dedication" },
  { key: "projects", label: "Projects" },
];
const STAT_LABEL_PATTERNS = {
  births: /^births?$/i,
  marriages: /^marriages?$/i,
  deaths: /^deaths?$/i,
  converts: /^converts?$/i,
  baptisms: /^baptisms?$/i,
  workers: /^workers?$/i,
  ministers: /^ministers?$/i,
  disciplinary: /^disciplinary\s*$/i,
  newParishes: /^new\s*parishes?$/i,
  newNations: /^new\s*nations?$/i,
  churchDedication: /^church\s*dedication$/i,
  projects: /^projects?$/i,
};

// Extract per-date statistics rows (one entry per dated row across all WEEK blocks).
function extractPerDateStatistics(sheet) {
  const range = XLSX.utils.decode_range(sheet["!ref"]);
  const headerHits = findAllCells(sheet, /^births?$/i); // every weekly block has a "Births" header
  const rows = [];

  for (const hit of headerHits) {
    // Map stat columns on this header row.
    const cols = {};
    let dateCol = null, daysCol = null;
    for (let c = range.s.c; c <= range.e.c; c++) {
      const cell = sheet[XLSX.utils.encode_cell({ r: hit.r, c })];
      if (!cell || cell.v == null) continue;
      const s = String(cell.v).trim().toLowerCase();
      if (s === "date") dateCol = c;
      else if (s === "days") daysCol = c;
      for (const f of STAT_FIELDS) {
        if (STAT_LABEL_PATTERNS[f.key].test(s)) cols[f.key] = c;
      }
    }

    // Walk down looking for dated entries (same logic as extractPerDateRows).
    for (let r = hit.r + 1; r <= Math.min(hit.r + 8, range.e.r); r++) {
      let isSectionEnd = false;
      for (let cc = range.s.c; cc <= range.e.c; cc++) {
        const cv = sheet[XLSX.utils.encode_cell({ r, c: cc })];
        if (!cv || cv.v == null) continue;
        const s = String(cv.v).trim().toLowerCase();
        if (s === "total" || s === "monthly average" || /^week\s*\d+/i.test(s)) {
          isSectionEnd = true;
          break;
        }
      }
      if (isSectionEnd) break;

      let dateVal = dateCol != null ? (sheet[XLSX.utils.encode_cell({ r, c: dateCol })]?.v ?? null) : null;
      if (typeof dateVal === "number") {
        const d = excelDateToJS(dateVal);
        if (d) dateVal = d;
      } else if (dateVal instanceof Date) {
        dateVal = new Date(dateVal.getUTCFullYear(), dateVal.getUTCMonth(), dateVal.getUTCDate());
      }
      const dateLocal = dateVal instanceof Date ? ymd(dateVal) : (dateVal || null);
      const dayLabel = daysCol != null
        ? String(sheet[XLSX.utils.encode_cell({ r, c: daysCol })]?.v ?? "").trim()
        : "";
      if (!dateLocal && !dayLabel) continue;

      const stats = {};
      let any = false;
      for (const f of STAT_FIELDS) {
        if (cols[f.key] == null) { stats[f.key] = 0; continue; }
        const cell = sheet[XLSX.utils.encode_cell({ r, c: cols[f.key] })];
        const v = cell && cell.v != null ? NUM(cell.v) : 0;
        stats[f.key] = v;
        if (v !== 0) any = true;
      }

      rows.push({ row: r, date: dateLocal, day: dayLabel, stats, hasAny: any });
    }
  }
  return rows;
}

// Find the file's "Total" row that sits below the LAST weekly block's statistics
// (e.g., row 48 for Mount Zion). Returns the entered totals per stat column.
function readEnteredStatTotals(sheet) {
  const range = XLSX.utils.decode_range(sheet["!ref"]);
  const headerHits = findAllCells(sheet, /^births?$/i);
  if (headerHits.length === 0) return null;
  const lastHeader = headerHits[headerHits.length - 1];

  // Map stat columns on the last header row.
  const cols = {};
  for (let c = range.s.c; c <= range.e.c; c++) {
    const cell = sheet[XLSX.utils.encode_cell({ r: lastHeader.r, c })];
    if (!cell || cell.v == null) continue;
    const s = String(cell.v).trim().toLowerCase();
    for (const f of STAT_FIELDS) {
      if (STAT_LABEL_PATTERNS[f.key].test(s)) cols[f.key] = c;
    }
  }

  // Find the FIRST "Total" row appearing AFTER the last header row (typically row 48).
  // Skip the per-week "Total" row (which sits ~6 rows below the header) by looking further down.
  for (let r = lastHeader.r + 6; r <= range.e.r; r++) {
    let isTotal = false;
    for (let c = range.s.c; c <= range.e.c; c++) {
      const cv = sheet[XLSX.utils.encode_cell({ r, c })];
      if (!cv || cv.v == null) continue;
      const s = String(cv.v).trim().toLowerCase();
      if (s === "total") { isTotal = true; break; }
    }
    if (!isTotal) continue;
    // Only treat this as the grand-total row if it has stat values populated.
    // Track the cell ADDRESS for each total — needed for the auto-fix patch downloads.
    const totals = {};
    const addresses = {};
    let populated = 0;
    for (const f of STAT_FIELDS) {
      if (cols[f.key] == null) { totals[f.key] = null; addresses[f.key] = null; continue; }
      const addr = XLSX.utils.encode_cell({ r, c: cols[f.key] });
      const cell = sheet[addr];
      const v = cell && cell.v != null ? NUM(cell.v) : null;
      totals[f.key] = v;
      addresses[f.key] = addr;
      if (v != null) populated++;
    }
    if (populated >= STAT_FIELDS.length / 2) return { row: r, totals, addresses, sheetName: null };
  }
  return null;
}

// For each WEEK block, find the "Total" row directly below it and capture
// the entered € total. Returns [{weekIndex, totalRow, enteredTotal, dateRange[]}].
function extractWeeklyTotals(sheet) {
  const range = XLSX.utils.decode_range(sheet["!ref"]);
  const headerHits = findAllCells(sheet, /^offering$/i);
  const out = [];

  headerHits.forEach((hit, idx) => {
    // Locate the totalMoney column on this header row.
    let totalMoneyCol = null;
    for (let c = range.s.c; c <= range.e.c; c++) {
      const cell = sheet[XLSX.utils.encode_cell({ r: hit.r, c })];
      if (!cell || cell.v == null) continue;
      const s = String(cell.v).trim().toLowerCase();
      if (/^total\s*\(?€\)?$/.test(s)) totalMoneyCol = c;
    }
    if (totalMoneyCol == null) return;

    // Walk down looking for a "Total" label (in any column) within ~8 rows.
    for (let r = hit.r + 1; r <= Math.min(hit.r + 8, range.e.r); r++) {
      let isTotal = false;
      for (let c = range.s.c; c <= range.e.c; c++) {
        const cv = sheet[XLSX.utils.encode_cell({ r, c })];
        if (!cv || cv.v == null) continue;
        if (String(cv.v).trim().toLowerCase() === "total") { isTotal = true; break; }
      }
      if (isTotal) {
        const enteredCell = sheet[XLSX.utils.encode_cell({ r, c: totalMoneyCol })];
        out.push({
          weekIndex: idx + 1,
          totalRow: r,
          headerRow: hit.r,
          enteredTotal: enteredCell && enteredCell.v != null ? NUM(enteredCell.v) : null,
        });
        break;
      }
    }
  });
  return out;
}

// Find the "Total" row at the bottom of the weekly section and read its monetary totals.
function readGrandTotalRow(sheet) {
  // The grand-total row is the row whose label cell contains "Total" alone (not "Monthly Average")
  // AND which has a numeric value in the columns under Offering / Tithe / Tnx_Giving / Others.
  // Strategy: find the header row containing "Offering", "Tithe", "Tnx_Giving", "Others",
  // then walk down looking for the row whose "Total " label appears AND whose Tithe column has the largest value.
  const headerHit = findCell(sheet, "Offering");
  if (!headerHit) return null;
  // Locate columns for offering / tithe / thanksgiving / others on that header row.
  const range = XLSX.utils.decode_range(sheet["!ref"]);
  const cols = {};
  for (let c = range.s.c; c <= range.e.c; c++) {
    const cell = sheet[XLSX.utils.encode_cell({ r: headerHit.r, c })];
    if (!cell || cell.v == null) continue;
    const s = String(cell.v).trim().toLowerCase();
    if (s === "offering") cols.offering = c;
    else if (s === "tithe") cols.tithe = c;
    else if (/tnx[_\s]?giving|thanksgiving|tnx giving/.test(s)) cols.thanksgiving = c;
    else if (s === "others") cols.others = c;
  }
  // Walk every "Total" / "Total " label in column G area (look for label row that has populated values in our cols).
  const totalLabels = findAllCells(sheet, /^\s*total\s*$/i);
  let best = null;
  for (const lab of totalLabels) {
    const vals = {};
    for (const k of Object.keys(cols)) {
      const cell = sheet[XLSX.utils.encode_cell({ r: lab.r, c: cols[k] })];
      vals[k] = cell ? NUM(cell.v) : 0;
    }
    const score = vals.tithe + vals.offering + vals.thanksgiving + vals.others;
    if (!best || score > best.score) best = { row: lab.r, vals, score };
  }
  return best ? { row: best.row, ...best.vals, cols } : null;
}

function readMonthlyAverageTotal(sheet) {
  const hit = findCell(sheet, "Monthly Average");
  if (!hit) return null;
  // The "Total" column is to the right; find the value labeled "Total" on the same header row as Men/Women/Children/Total.
  // For our template, the Total is the last numeric value to the right on that row.
  const range = XLSX.utils.decode_range(sheet["!ref"]);
  let last = null;
  for (let c = hit.c + 1; c <= range.e.c; c++) {
    const cell = sheet[XLSX.utils.encode_cell({ r: hit.r, c })];
    if (cell && typeof cell.v === "number") last = cell.v;
  }
  return last;
}

// Read the per-demographic monthly averages (Men/Women/Children) from the row labelled "Monthly Average".
// Maps the values to columns by looking at the most recent attendance header row above.
function readMonthlyAverageDemographics(sheet) {
  const hit = findCell(sheet, "Monthly Average");
  if (!hit) return { men: null, women: null, children: null };
  const range = XLSX.utils.decode_range(sheet["!ref"]);
  // Find the closest header row above containing "Men", "Women", "Children".
  let headerRow = null;
  for (let r = hit.r - 1; r >= range.s.r; r--) {
    let hasMen = false, hasWomen = false, hasChildren = false;
    for (let c = range.s.c; c <= range.e.c; c++) {
      const cell = sheet[XLSX.utils.encode_cell({ r, c })];
      if (!cell || cell.v == null) continue;
      const s = String(cell.v).trim().toLowerCase();
      if (s === "men") hasMen = true;
      else if (s === "women") hasWomen = true;
      else if (s === "children") hasChildren = true;
    }
    if (hasMen && hasWomen && hasChildren) { headerRow = r; break; }
  }
  if (headerRow == null) return { men: null, women: null, children: null };
  const cols = {};
  for (let c = range.s.c; c <= range.e.c; c++) {
    const cell = sheet[XLSX.utils.encode_cell({ r: headerRow, c })];
    if (!cell || cell.v == null) continue;
    const s = String(cell.v).trim().toLowerCase();
    if (s === "men") cols.men = c;
    else if (s === "women") cols.women = c;
    else if (s === "children") cols.children = c;
  }
  const get = (col) => {
    if (col == null) return null;
    const cell = sheet[XLSX.utils.encode_cell({ r: hit.r, c: col })];
    return cell && cell.v != null ? NUM(cell.v) : null;
  };
  return { men: get(cols.men), women: get(cols.women), children: get(cols.children) };
}

function readActualRemittance(sheet) {
  // Each section is identified by a header phrase, the row below has labels (e.g. "5% of Offering"),
  // and the row below that has the actual amounts.
  const out = {
    regional: { offering5: null, tithe20: null, total: null },
    operations: { tithe55: null, offering95: null, thanksgiving30: null, total: null },
    pastorAllow: { tithe20: null, thanksgiving70: null, total: null },
    provincial: { tithe5: null },
  };

  function readLabelValuePair(labelPattern) {
    // Find the label, then read the value cell directly below it.
    const hit = findCell(sheet, labelPattern);
    if (!hit) return null;
    const cell = sheet[XLSX.utils.encode_cell({ r: hit.r + 1, c: hit.c })];
    return cell ? NUM(cell.v) : null;
  }

  // Regional section
  // NOTE: percentage regexes use (?<!\d) to prevent "5%" from matching inside "55%", etc.
  out.regional.offering5 = readLabelValuePair(/(?<!\d)5%\s*of\s*offering/i);
  out.regional.tithe20 = readLabelValuePair(/(?<!\d)20%\s*of\s*tithe$/i); // first "20% of Tithe" appears in Regional row
  // The "Total Remittance" label appears in K51 area
  out.regional.total = readLabelValuePair(/total\s*remittance/i);

  // Parish Operations
  out.operations.tithe55 = readLabelValuePair(/(?<!\d)55%\s*of\s*tithe/i);
  out.operations.offering95 = readLabelValuePair(/(?<!\d)95%\s*of\s*offering/i);
  out.operations.thanksgiving30 = readLabelValuePair(/(?<!\d)30%\s*of\s*t[\/\s]?giving|(?<!\d)30%\s*of\s*thanksgiving/i);
  // Multiple "Total (€)" labels — find the one in the Parish Operations row by reading Row 55 mid-cells.
  out.operations.total = (function () {
    // Locate the "Twds. Parish Operations" header, then take the totals row two rows below.
    const hdr = findCell(sheet, /twds\.?\s*parish\s*operations/i);
    if (!hdr) return null;
    // Look on the row containing the 55%/95%/30% values for a "Total (€)" label
    const labels = findAllCells(sheet, /total\s*\(?€\)?/i);
    for (const lab of labels) {
      // Operations total row is the row immediately below the % labels under hdr.
      // We pick the label that sits on the same row as the 55% label.
      const cell = sheet[XLSX.utils.encode_cell({ r: lab.r + 1, c: lab.c })];
      if (cell && typeof cell.v === "number" && Math.abs(cell.v - ((out.operations.tithe55 ?? 0) + (out.operations.offering95 ?? 0) + (out.operations.thanksgiving30 ?? 0))) < 1) {
        return cell.v;
      }
    }
    return null;
  })();

  // Pastor Allowance — the SECOND "20% of Tithe" + "70% of T/Giving"
  out.pastorAllow.thanksgiving70 = readLabelValuePair(/(?<!\d)70%\s*of\s*t[\/\s]?giving|(?<!\d)70%\s*of\s*thanksgiving/i);
  // For pastorAllow.tithe20 we need the SECOND occurrence of "20% of Tithe" (or a label "20% of Tithes").
  out.pastorAllow.tithe20 = (function () {
    const hits = findAllCells(sheet, /(?<!\d)20%\s*of\s*tithes?$/i);
    if (hits.length >= 2) {
      const second = hits[1];
      const cell = sheet[XLSX.utils.encode_cell({ r: second.r + 1, c: second.c })];
      return cell ? NUM(cell.v) : null;
    }
    return null;
  })();
  out.pastorAllow.total = (function () {
    // Pastor allowance total is the "Total (€)" on the same row as the 70% value.
    const hit = findCell(sheet, /(?<!\d)70%\s*of\s*t[\/\s]?giving/i);
    if (!hit) return null;
    const labels = findAllCells(sheet, /total\s*\(?€\)?/i);
    for (const lab of labels) {
      if (lab.r === hit.r) {
        const cell = sheet[XLSX.utils.encode_cell({ r: lab.r + 1, c: lab.c })];
        if (cell) return NUM(cell.v);
      }
    }
    return null;
  })();

  // Provincial: 5% of Tithe
  out.provincial.tithe5 = readLabelValuePair(/(?<!\d)5%\s*of\s*tithe/i);

  return out;
}

// Detect whether the file uses the current canonical template, or an outdated one.
// Returns { valid, issues[] } where each issue is { kind: "structural"|"formula", message, detail }.
// Used by the UI to show an "outdated template" banner and tag failed checks correctly.
function detectTemplateValidity(sheet, totals, actualRemittance) {
  const issues = [];

  // ---- Structural checks ----
  // 1. Required Row 1 labels exist somewhere in the file.
  const requiredLabels = [
    { name: "Name Of Parish", patterns: [/name\s*of\s*parish/i] },
    { name: "Pastor In Charge", patterns: [/pastor\s*in\s*charge/i] },
    { name: "Month/Year", patterns: [/month\s*\/?\s*year/i] },
  ];
  for (const req of requiredLabels) {
    const found = req.patterns.some(p => findCell(sheet, p));
    if (!found) {
      issues.push({
        kind: "structural",
        message: `Missing label: "${req.name}"`,
        detail: "The current template includes this label in the header row.",
      });
    }
  }

  // 2. Section headers expected.
  const sectionLabels = [
    { name: "Regional Remittance", patterns: [/regional\s*remittance/i] },
    { name: "Parish Operations", patterns: [/twds\.?\s*parish\s*operations|parish\s*operations/i] },
    { name: "Provincial Remittance", patterns: [/provincial\s*remittance/i] },
  ];
  for (const sec of sectionLabels) {
    const found = sec.patterns.some(p => findCell(sheet, p));
    if (!found) {
      issues.push({
        kind: "structural",
        message: `Missing section: "${sec.name}"`,
        detail: "The current template includes this remittance section.",
      });
    }
  }

  // ---- Formula checks ----
  // The file's built-in formulas should produce values matching the canonical rules.
  // We sample a few checkpoints and compare the entered value against what the rule predicts.
  if (totals && totals.tithe != null && totals.offering != null) {
    const tol = 0.05; // generous: allows 1-2 cents of rounding
    const checks = [
      { label: "Regional 5% of Offering", entered: actualRemittance.regional.offering5, expected: totals.offering * CANONICAL_RULES.regional.offering },
      { label: "Regional 20% of Tithe",   entered: actualRemittance.regional.tithe20,   expected: totals.tithe    * CANONICAL_RULES.regional.tithe },
      { label: "Parish Ops 55% of Tithe", entered: actualRemittance.operations.tithe55, expected: totals.tithe    * CANONICAL_RULES.parishOps.tithe },
      { label: "Parish Ops 95% of Offering", entered: actualRemittance.operations.offering95, expected: totals.offering * CANONICAL_RULES.parishOps.offering },
      { label: "Parish Ops 30% of T/Giving", entered: actualRemittance.operations.thanksgiving30, expected: (totals.thanksgiving || 0) * CANONICAL_RULES.parishOps.thanksgiving },
      { label: "Pastor Allow 20% of Tithe", entered: actualRemittance.pastorAllow.tithe20, expected: totals.tithe * CANONICAL_RULES.pastorAllow.tithe },
      { label: "Pastor Allow 70% of T/Giving", entered: actualRemittance.pastorAllow.thanksgiving70, expected: (totals.thanksgiving || 0) * CANONICAL_RULES.pastorAllow.thanksgiving },
      { label: "Provincial 5% of Tithe", entered: actualRemittance.provincial.tithe5, expected: totals.tithe * CANONICAL_RULES.provincial.tithe },
    ];
    // For each check: if the entered value is non-null and DIVERGES from canonical AND
    // appears to use a DIFFERENT consistent rate (not just an arithmetic typo), it's a
    // template formula error. Heuristic: compute the implied rate, see if it's a "round"
    // percentage other than the canonical one.
    for (const c of checks) {
      if (c.entered == null) continue;
      if (Math.abs(c.entered - c.expected) < tol) continue; // matches canonical, no issue
      // Compute the implied rate against the source (tithe or offering or tnx).
      // We need the divisor — use the closest source.
      let divisor = null;
      if (/tithe/i.test(c.label)) divisor = totals.tithe;
      else if (/offering/i.test(c.label)) divisor = totals.offering;
      else if (/giving/i.test(c.label)) divisor = totals.thanksgiving;
      if (!divisor) continue;
      const impliedRate = c.entered / divisor;
      // "Round" percentages: 0.01, 0.02, ... 0.99. Check if implied rate is within 0.005 of any round %.
      const nearestRoundPct = Math.round(impliedRate * 100) / 100;
      const isRoundRate = Math.abs(impliedRate - nearestRoundPct) < 0.005;
      if (isRoundRate) {
        issues.push({
          kind: "formula",
          message: `${c.label}: file uses ${(nearestRoundPct * 100).toFixed(0)}% instead of canonical ${(c.expected / divisor * 100).toFixed(0)}%`,
          detail: `Entered ${c.entered.toFixed(2)} ÷ source ${divisor.toFixed(2)} ≈ ${(nearestRoundPct * 100).toFixed(0)}%. The current template uses ${(c.expected / divisor * 100).toFixed(0)}%.`,
        });
      }
    }
  }

  return {
    valid: issues.length === 0,
    structuralIssues: issues.filter(i => i.kind === "structural"),
    formulaIssues: issues.filter(i => i.kind === "formula"),
    issues,
  };
}

// Holds the most recently parsed workbook + filename so the auto-fix patch handler
// can mutate cells and re-download. Reset on every new file load.
let CURRENT_FILE = { workbook: null, filename: null, sheetName: null };

function parseWorkbook(wb) {
  const sheetName = wb.SheetNames[0];
  const sheet = wb.Sheets[sheetName];

  // Row 1 fields use valueForHeaderLabel — the value sits BELOW the label
  // (Mount Zion, New Song, Oct 2025 all use this layout). Falling back to
  // right-walking would pick up the next label on the same row as the "value".
  const parish = valueForHeaderLabel(sheet, "Name Of Parish");
  const pastor = valueForHeaderLabel(sheet, "Pastor In Charge");
  // Mobile/email use the same below-first lookup, with a whole-sheet pattern scan
  // as a final fallback (handles templates where the value floats to a different cell).
  const mobile = valueForHeaderLabel(sheet, "Mobile") || findMobileInSheet(sheet);
  const email = valueForHeaderLabel(sheet, "Email") || findEmailInSheet(sheet);
  const monthYear = detectMonthYear(sheet);
  const totals = readGrandTotalRow(sheet);
  const avgAttendance = readMonthlyAverageTotal(sheet);
  const avgDemographics = readMonthlyAverageDemographics(sheet);
  const actual = readActualRemittance(sheet);
  const perDate = extractPerDateRows(sheet);
  const weeklyTotalsRaw = extractWeeklyTotals(sheet);
  const perDateStats = extractPerDateStatistics(sheet);
  const enteredStatTotals = readEnteredStatTotals(sheet);

  if (!totals) throw new Error("Could not locate the grand-total row in the report.");

  // For each WEEK block, sum the per-date money rows that fall between this block's header
  // and its "Total" row. Compares to the entered weekly total (e.g., L12, L20, L28, ...).
  const weeklyTotals = weeklyTotalsRaw.map((wt) => {
    const rowsInWeek = perDate.filter(d => d.row > wt.headerRow && d.row < wt.totalRow);
    const recomputed = round2(rowsInWeek.reduce((acc, d) => acc + d.money.totalCalculated, 0));
    return {
      weekIndex: wt.weekIndex,
      enteredTotal: wt.enteredTotal,
      recomputedTotal: recomputed,
      contributingRows: rowsInWeek.length,
      validated: wt.enteredTotal != null ? Math.abs(wt.enteredTotal - recomputed) < 0.01 : null,
    };
  });

  const offering = totals.offering ?? 0;
  const tithe = totals.tithe ?? 0;
  const thanksgiving = totals.thanksgiving ?? 0;
  const others = totals.others ?? 0;

  // Calculations
  const calc = {
    regional: {
      offering5: round2(offering * 0.05),
      tithe20: round2(tithe * 0.20),
      total: round2(offering * 0.05 + tithe * 0.20),
    },
    operations: {
      tithe55: round2(tithe * 0.55),
      offering95: round2(offering * 0.95),
      thanksgiving30: round2(thanksgiving * 0.30),
      total: round2(tithe * 0.55 + offering * 0.95 + thanksgiving * 0.30),
    },
    pastorAllow: {
      tithe20: round2(tithe * 0.20),
      thanksgiving70: round2(thanksgiving * 0.70),
      total: round2(tithe * 0.20 + thanksgiving * 0.70),
    },
    provincial: {
      tithe5: round2(tithe * 0.05),
    },
  };

  // ---- Re-sum every per-date row to validate Row 2 (monthly totals) ----
  const reSum = perDate.reduce(
    (acc, r) => ({
      offering: acc.offering + r.money.offering,
      tithe: acc.tithe + r.money.tithe,
      thanksgiving: acc.thanksgiving + r.money.thanksgiving,
      others: acc.others + r.money.others,
      menSum: acc.menSum + r.attendance.men,
      womenSum: acc.womenSum + r.attendance.women,
      childrenSum: acc.childrenSum + r.attendance.children,
      menWomenChildrenSum: acc.menWomenChildrenSum + (r.attendance.totalCalculated || 0),
      attendanceWeeks: acc.attendanceWeeks + (r.hasAttendance ? 1 : 0),
    }),
    { offering: 0, tithe: 0, thanksgiving: 0, others: 0, menSum: 0, womenSum: 0, childrenSum: 0, menWomenChildrenSum: 0, attendanceWeeks: 0 }
  );
  reSum.offering = round2(reSum.offering);
  reSum.tithe = round2(reSum.tithe);
  reSum.thanksgiving = round2(reSum.thanksgiving);
  reSum.others = round2(reSum.others);
  reSum.sum = round2(reSum.offering + reSum.tithe + reSum.thanksgiving + reSum.others);
  // Use TOTAL number of dated rows (not just non-zero attendance weeks) as the divisor —
  // this matches what the file's "Monthly Average" row does in the Mount Zion template.
  const datedWeekCount = perDate.filter(d => d.date).length;
  const datedDiv = datedWeekCount || 1;
  // Compute averages at FULL precision so comparison against the file's values isn't
  // sabotaged by rounding (e.g., file=63.75 vs Math.round(63.75*10)/10=63.8 in JS engines
  // that round half-to-even). Display rounding happens at render time, not here.
  reSum.averageAttendanceCalculated = datedWeekCount > 0
    ? reSum.menWomenChildrenSum / datedWeekCount
    : 0;
  reSum.averageMenCalculated = reSum.menSum / datedDiv;
  reSum.averageWomenCalculated = reSum.womenSum / datedDiv;
  reSum.averageChildrenCalculated = reSum.childrenSum / datedDiv;

  // ---- Allocation reconciliation: every euro must be allocated exactly once ----
  // Sum of entered remittances must equal Total Offering + Tithe + Thanksgiving + Others.
  const enteredAllocations = (
    NUM(actual.regional.offering5) +
    NUM(actual.regional.tithe20) +
    NUM(actual.operations.tithe55) +
    NUM(actual.operations.offering95) +
    NUM(actual.operations.thanksgiving30) +
    NUM(actual.pastorAllow.tithe20) +
    NUM(actual.pastorAllow.thanksgiving70) +
    NUM(actual.provincial.tithe5)
  );
  const totalIncome = offering + tithe + thanksgiving + others;
  // Note: "Others" has no allocation rule, so the expected reconciled sum excludes it.
  const expectedAllocations = round2(totalIncome - others);
  const allocationReconciliation = {
    totalIncome: round2(totalIncome),
    others,
    expectedAllocations,
    enteredAllocations: round2(enteredAllocations),
    delta: round2(enteredAllocations - expectedAllocations),
    validated: Math.abs(enteredAllocations - expectedAllocations) < 0.01,
  };

  const monthlyValidation = {
    offering: { reported: offering, recomputed: reSum.offering, validated: Math.abs(offering - reSum.offering) < 0.01 },
    tithe: { reported: tithe, recomputed: reSum.tithe, validated: Math.abs(tithe - reSum.tithe) < 0.01 },
    thanksgiving: { reported: thanksgiving, recomputed: reSum.thanksgiving, validated: Math.abs(thanksgiving - reSum.thanksgiving) < 0.01 },
    others: { reported: others, recomputed: reSum.others, validated: Math.abs(others - reSum.others) < 0.01 },
    sum: { reported: round2(offering + tithe + thanksgiving + others), recomputed: reSum.sum, validated: Math.abs(round2(offering + tithe + thanksgiving + others) - reSum.sum) < 0.01 },
    // Tolerance is generous (0.05) because parishes round to varying precision.
    // The file's printed value (e.g., 63.75 or 17.4) is the ground truth; we just
    // need to be robust to "70.5 vs 70.50000001" floating-point noise.
    averageAttendance: avgAttendance != null
      ? { reported: NUM(avgAttendance), recomputed: reSum.averageAttendanceCalculated, validated: Math.abs(NUM(avgAttendance) - reSum.averageAttendanceCalculated) < 0.05 }
      : { reported: null, recomputed: reSum.averageAttendanceCalculated, validated: null },
    averageMen: avgDemographics.men != null
      ? { reported: avgDemographics.men, recomputed: reSum.averageMenCalculated, validated: Math.abs(avgDemographics.men - reSum.averageMenCalculated) < 0.05 }
      : { reported: null, recomputed: reSum.averageMenCalculated, validated: null },
    averageWomen: avgDemographics.women != null
      ? { reported: avgDemographics.women, recomputed: reSum.averageWomenCalculated, validated: Math.abs(avgDemographics.women - reSum.averageWomenCalculated) < 0.05 }
      : { reported: null, recomputed: reSum.averageWomenCalculated, validated: null },
    averageChildren: avgDemographics.children != null
      ? { reported: avgDemographics.children, recomputed: reSum.averageChildrenCalculated, validated: Math.abs(avgDemographics.children - reSum.averageChildrenCalculated) < 0.05 }
      : { reported: null, recomputed: reSum.averageChildrenCalculated, validated: null },
  };

  // ---- Sanity checks ----
  // Returns an array of { id, label, level: "ok"|"warn"|"fail", detail }.
  const sanityChecks = (function () {
    const out = [];

    // Negatives in any monetary or attendance value across per-date rows.
    const negatives = [];
    for (const d of perDate) {
      ["men", "women", "children"].forEach(k => { if (d.attendance[k] < 0) negatives.push(`${d.date || `row ${d.row}`} attendance.${k}=${d.attendance[k]}`); });
      ["offering", "tithe", "thanksgiving", "others"].forEach(k => { if (d.money[k] < 0) negatives.push(`${d.date || `row ${d.row}`} money.${k}=${d.money[k]}`); });
    }
    out.push(negatives.length === 0
      ? { id: "no-negatives", label: "No negative values", level: "ok", detail: null }
      : { id: "no-negatives", label: "Negative values present", level: "fail", detail: negatives.join("; ") });

    // Missing required Row 1 fields.
    const missingFields = [];
    if (!parish) missingFields.push("Name Of Parish");
    if (!pastor) missingFields.push("Pastor In Charge");
    if (monthYear.month == null) missingFields.push("Report month (no Sunday dates found)");
    out.push(missingFields.length === 0
      ? { id: "row1-complete", label: "Row 1 (Parish/Pastor/Month) complete", level: "ok", detail: null }
      : { id: "row1-complete", label: "Row 1 fields missing", level: "fail", detail: missingFields.join(", ") });

    // Sundays consecutive (7 days apart) and all in the same month as the detected report month.
    const sundayRows = perDate
      .filter(d => d.date && (d.day || "").toLowerCase() === "sunday")
      .map(d => ({ row: d.row, date: new Date(d.date + "T00:00:00") }))
      .sort((a, b) => a.date - b.date);

    if (sundayRows.length >= 2) {
      const gaps = [];
      for (let i = 1; i < sundayRows.length; i++) {
        const dayDiff = (sundayRows[i].date - sundayRows[i - 1].date) / 86400000;
        if (dayDiff !== 7) gaps.push(`${ymd(sundayRows[i - 1].date)} → ${ymd(sundayRows[i].date)} (${dayDiff}d)`);
      }
      out.push(gaps.length === 0
        ? { id: "sundays-consecutive", label: "All Sundays are consecutive (7 days apart)", level: "ok", detail: null }
        : { id: "sundays-consecutive", label: "Non-consecutive Sundays detected", level: "warn", detail: gaps.join("; ") });
    }

    // All Sunday dates in the detected report month.
    if (monthYear.month != null && sundayRows.length > 0) {
      const wrong = sundayRows.filter(s => s.date.getMonth() !== monthYear.month || s.date.getFullYear() !== monthYear.year);
      out.push(wrong.length === 0
        ? { id: "dates-in-month", label: `All Sundays fall in ${monthYear.label}`, level: "ok", detail: null }
        : { id: "dates-in-month", label: `Sundays outside ${monthYear.label}`, level: "warn", detail: wrong.map(s => ymd(s.date)).join(", ") });
    }

    // No fully-empty Sunday rows. We only flag empty Sundays that ALSO have a date entered —
    // an undated empty Sunday row is the optional WEEK 5 placeholder that's normal in months
    // with only 4 Sundays. Flagging it would cry wolf every October/February/etc.
    const emptySundays = perDate.filter(d =>
      (d.day || "").toLowerCase() === "sunday" && !d.hasAttendance && !d.hasMoney && d.date
    );
    if (emptySundays.length > 0) {
      out.push({
        id: "no-empty-sundays",
        label: "Some dated Sundays have no values entered",
        level: "warn",
        detail: emptySundays.map(d => d.date).join(", "),
      });
    } else {
      out.push({ id: "no-empty-sundays", label: "Every dated Sunday has values entered", level: "ok", detail: null });
    }

    return out;
  })();

  return {
    source: { sheet: sheetName, parish, pastor, mobile, email, reportMonth: monthYear.label, monthIndex: monthYear.month, year: monthYear.year },
    parishRecords: {
      averageAttendance: avgAttendance,
      totalOffering: offering,
      totalTithe: tithe,
      totalThanksgiving: thanksgiving,
      totalOthers: others,
      sum: round2(offering + tithe + thanksgiving + others),
    },
    perDate,
    monthlyValidation,
    weeklyTotals,
    allocationReconciliation,
    sanityChecks,
    templateValidity: detectTemplateValidity(sheet, { tithe, offering, thanksgiving, others }, actual),
    statistics: (function () {
      // Per-stat-column re-sum vs entered total in row 48.
      const validation = STAT_FIELDS.map(f => {
        const recomputed = perDateStats.reduce((a, r) => a + (r.stats[f.key] || 0), 0);
        const reported = enteredStatTotals ? enteredStatTotals.totals[f.key] : null;
        const cellAddress = enteredStatTotals ? enteredStatTotals.addresses[f.key] : null;
        return {
          key: f.key,
          label: f.label,
          reported,
          recomputed,
          cellAddress,                  // e.g., "P48" — needed for auto-fix
          validated: reported != null ? Math.abs(reported - recomputed) < 0.01 : null,
          hasAnyValue: recomputed > 0 || (reported != null && reported > 0),
        };
      });
      return { perDate: perDateStats, validation };
    })(),
    regionalRemittance: { calculated: calc.regional, actual: actual.regional },
    parishOperations: { calculated: calc.operations, actual: actual.operations },
    parishPastorAllowance: { calculated: calc.pastorAllow, actual: actual.pastorAllow },
    provincialRemittance: { calculated: calc.provincial, actual: actual.provincial },
    others: { totalOthers: others, allocationRule: null },
    coverage: {
      offering: { rules: "5% Regional + 95% Parish Ops", coveragePct: 100 },
      tithe: { rules: "20% Regional + 55% Parish Ops + 20% Pastor + 5% Provincial", coveragePct: 100 },
      thanksgiving: { rules: "30% Parish Ops + 70% Pastor", coveragePct: 100 },
      others: { rules: "no allocation rule defined", coveragePct: 0 },
    },
  };
}

// ============================================================
//  RENDERING
// ============================================================

const $ = (sel) => document.querySelector(sel);
const fmt = (n) => (n == null ? "—" : Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const fmtInt = (n) => (n == null ? "—" : Number(n).toLocaleString());
// Count formatter: ALWAYS rounds to whole numbers. Used for headcount fields
// (Converts, Births, Workers, Attendance, etc.) where decimals are nonsensical.
// 5.0 → 5, 5.49 → 5, 5.5 → 6.
const fmtCount = (n) => (n == null ? "—" : Math.round(Number(n)).toLocaleString());

// Pick the right formatter for a given check object. Section is the primary
// signal — labels can contain ambiguous words like "sum" (as in "per-date sum")
// that would otherwise be misclassified as monetary. Single source of truth so
// every callsite formats consistently.
function formatterForCheck(check) {
  const section = (check.section || "").toLowerCase();
  const label = (check.label || "").toLowerCase();
  // Non-monetary sections — counts (always integer)
  if (section === "statistics") return fmtCount;
  if (section === "per-date attendance") return fmtCount;
  // Averages — keep decimals
  if (/average|avg/.test(label)) return fmtSmart;
  // Monetary sections
  if (/^(parish operations|regional remittance|pastor allowance|provincial remittance|allocation reconciliation|weekly totals|per-date money|parish records)$/i.test(section)) return fmt;
  // Default: monetary
  return fmt;
}
// Smart formatter: shows integers without trailing zeros (5 instead of 5.00),
// keeps non-integers with up to 2 decimals (5.5, 17.4). Used in user-facing
// explanations where money/count distinction matters AND the value may be a true average.
const fmtSmart = (n) => {
  if (n == null) return "—";
  const num = Number(n);
  if (!isFinite(num)) return String(n);
  return Number.isInteger(num)
    ? num.toLocaleString()
    : num.toLocaleString(undefined, { maximumFractionDigits: 2 });
};

function flagCell(calc, actual) {
  if (actual == null) return `<td class="flag"><span class="bad-pill">missing</span></td>`;
  const diff = Math.abs(calc - actual);
  const ok = diff < 0.01;
  return `<td class="flag"><span class="${ok ? "pos" : "neg"}">${ok ? icon("check-circle-2") : icon("x-circle") + " Not validated"}</span></td>`;
}

function row(label, calc, actual) {
  return `<tr>
    <td>${label}</td>
    <td class="num">${fmt(calc)}</td>
    <td class="num">${fmt(actual)}</td>
    ${flagCell(calc, actual)}
  </tr>`;
}

// Row used for the new Row-2 monthly-validation table: Reported vs Re-summed.
// `kind` controls formatting: "money" = 2 decimals, "avg" = up to 2 decimals (no trailing zero).
function monthlyRow(label, v, kind = "money") {
  const fmtVal = (n) => {
    if (n == null) return "—";
    if (kind === "avg") {
      // Show what the file shows: 160.25, 70.5, 26, 17.4, etc. (no forced trailing zeros)
      const rounded = Math.round(Number(n) * 100) / 100;
      return rounded.toLocaleString(undefined, { maximumFractionDigits: 2 });
    }
    return fmt(n);
  };
  if (v.reported == null) {
    return `<tr>
      <td>${label}</td>
      <td class="num">—</td>
      <td class="num">${fmtVal(v.recomputed)}</td>
      <td class="flag"><span class="bad-pill">no reported value</span></td>
    </tr>`;
  }
  const ok = v.validated;
  return `<tr>
    <td>${label}</td>
    <td class="num">${fmtVal(v.reported)}</td>
    <td class="num">${fmtVal(v.recomputed)}</td>
    <td class="flag"><span class="${ok ? "pos" : "neg"}">${ok ? icon("check-circle-2") : icon("x-circle") + " Not validated"}</span></td>
  </tr>`;
}

// Inline ✓/✗ used in the Per-Date Detail table.
function perDateFlag(validated, hasValues) {
  if (validated == null) return hasValues ? "—" : "";
  return validated
    ? `<span class="pos" title="Validated">${icon("check-circle-2")}</span>`
    : `<span class="neg" title="Not validated">${icon("x-circle")}</span>`;
}

// ---- Helpers for "float failed sections to top" ----
// Each section reports whether it currently has issues. The renderOrderedSections()
// helper takes a list of {id, html, hasErrors} and emits the failing ones first,
// followed by the clean ones in their natural order.
function hasSanityErrors(checks) {
  return checks.some(c => c.level === "fail" || c.level === "warn");
}
function hasWeeklyTotalsErrors(weeklyTotals) {
  return weeklyTotals.some(w => w.validated === false);
}
function hasPerDateErrors(perDate) {
  return perDate.some(d => d.attendance.validated === false || d.money.validated === false);
}
function hasStatisticsErrors(stats) {
  if (!stats || !stats.validation) return false;
  return stats.validation.some(s => s.validated === false);
}
function hasBuildUpErrors(monthlyValidation) {
  const entries = [
    monthlyValidation.averageAttendance,
    monthlyValidation.offering,
    monthlyValidation.tithe,
    monthlyValidation.thanksgiving,
    monthlyValidation.others,
  ];
  return entries.some(v => v && v.reported != null && !v.validated);
}
// Take a list of {id, html, hasErrors} and emit failing sections first.
// Within each group (failing/clean) the natural input order is preserved (stable sort).
function renderOrderedSections(sections) {
  const failing = sections.filter(s => s.hasErrors);
  const clean = sections.filter(s => !s.hasErrors);
  return [...failing, ...clean].map(s => s.html).join("\n");
}

function renderSanity(checks) {
  const counts = checks.reduce((a, c) => { a[c.level] = (a[c.level] || 0) + 1; return a; }, {});
  const badgeCls = counts.fail ? "bad" : counts.warn ? "warn" : "good";
  const badgeText = `${counts.ok || 0} ok · ${counts.warn || 0} warn · ${counts.fail || 0} fail`;
  const hasErr = !!(counts.fail || counts.warn);
  return `
    <details class="section" data-section-id="sanity" data-has-errors="${hasErr}" ${hasErr ? "open" : ""}>
      <summary>Sanity Checks <span class="badge ${badgeCls}">${badgeText}</span></summary>
      <div class="body">
        <div class="sanity">
          ${checks.map(c => `
            <div class="item ${c.level}">
              <span class="icon">${c.level === "ok" ? icon("check-circle-2") : c.level === "warn" ? icon("alert-triangle") : icon("x-circle")}</span>
              <div>
                <div>${c.label}</div>
                ${c.detail ? `<div class="detail">${escapeHtml(c.detail)}</div>` : ""}
              </div>
            </div>
          `).join("")}
        </div>
      </div>
    </details>`;
}

function renderWeeklyTotals(weeklyTotals) {
  if (!weeklyTotals.length) return "";
  const allOk = weeklyTotals.every(w => w.validated);
  const badge = allOk ? `<span class="badge good">${weeklyTotals.length} validated</span>` : `<span class="badge bad">${weeklyTotals.filter(w => !w.validated).length} failed</span>`;
  return `
    <details class="section" data-section-id="weekly-totals" data-has-errors="${!allOk}" ${allOk ? "" : "open"}>
      <summary>Weekly Totals (re-summed from per-date) ${badge}</summary>
      <div class="body">
        <table>
          <thead><tr><th>Week</th><th class="num">Entered € Total</th><th class="num">Re-summed</th><th class="num">Δ</th><th class="flag">Match</th></tr></thead>
          ${weeklyTotals.map(w => {
            const ok = w.validated;
            const delta = w.enteredTotal != null ? Math.abs(w.enteredTotal - w.recomputedTotal) : 0;
            return `<tr>
              <td>WEEK ${w.weekIndex}</td>
              <td class="num">${w.enteredTotal != null ? fmt(w.enteredTotal) : "—"}</td>
              <td class="num">${fmt(w.recomputedTotal)}</td>
              <td class="num">${fmt(delta)}</td>
              <td class="flag">${ok == null ? `<span class="bad-pill">no entered</span>` : `<span class="${ok ? "pos" : "neg"}">${ok ? icon("check-circle-2") : icon("x-circle") + " Not validated"}</span>`}</td>
            </tr>`;
          }).join("")}
        </table>
      </div>
    </details>`;
}

function renderAllocationReconciliation(a) {
  const ok = a.validated;
