  const badge = ok ? `<span class="badge good">balances</span>` : `<span class="badge bad">Δ ${fmt(Math.abs(a.delta))}</span>`;
  return `
    <details class="section" data-section-id="allocation" data-has-errors="${!ok}" ${ok ? "" : "open"}>
      <summary>Allocation Reconciliation ${badge}</summary>
      <div class="body">
        <table>
          <tr><td>Total monetary income (Offering + Tithe + Tnx + Others)</td><td class="num">${fmt(a.totalIncome)}</td></tr>
          <tr><td>Others (no allocation rule defined)</td><td class="num muted">${fmt(a.others)}</td></tr>
          <tr><td><strong>Expected allocations</strong> (Total − Others)</td><td class="num"><strong>${fmt(a.expectedAllocations)}</strong></td></tr>
          <tr><td>Sum of all entered remittances</td><td class="num">${fmt(a.enteredAllocations)}</td></tr>
          <tr><td>Δ (entered − expected)</td><td class="num ${Math.abs(a.delta) < 0.01 ? "" : "neg"}">${fmt(a.delta)}</td></tr>
          <tr><td>Match</td><td class="flag"><span class="${ok ? "pos" : "neg"}">${ok ? icon("check-circle-2") : icon("x-circle") + " Not validated"}</span></td></tr>
        </table>
        <div class="meta" style="margin-top:6px">Verifies that all monetary income (excluding Others) has been allocated to exactly one of: Regional · Parish Ops · Pastor · Provincial.</div>
      </div>
    </details>`;
}

function renderStatistics(stats) {
  const v = stats.validation;
  // Adaptive: only show stat columns that have ANY value across the month.
  const visible = v.filter(s => s.hasAnyValue);
  if (visible.length === 0) {
    return `
      <details class="section" data-section-id="statistics" data-has-errors="false">
        <summary>Statistics (Births, Marriages, etc.) <span class="badge">all zero</span></summary>
        <div class="body">
          <div class="meta">No statistics columns had any non-zero values this month.</div>
        </div>
      </details>`;
  }
  const allOk = visible.every(s => s.validated !== false);
  const badge = allOk ? `<span class="badge good">${visible.length} validated</span>` : `<span class="badge bad">${visible.filter(s => s.validated === false).length} failed</span>`;
  return `
    <details class="section" data-section-id="statistics" data-has-errors="${!allOk}" ${allOk ? "" : "open"}>
      <summary>Statistics ${badge}</summary>
      <div class="body">
        <table>
          <thead><tr><th>Field</th><th class="num">Per-date sum</th><th class="num">Reported total</th><th class="flag">Match</th></tr></thead>
          ${visible.map(s => `
            <tr>
              <td>${s.label}</td>
              <td class="num">${fmtCount(s.recomputed)}</td>
              <td class="num">${s.reported != null ? fmtCount(s.reported) : "—"}</td>
              <td class="flag">${s.validated == null ? `<span class="bad-pill">no reported</span>` : `<span class="${s.validated ? "pos" : "neg"}">${s.validated ? icon("check-circle-2") : icon("x-circle") + " Not validated"}</span>`}</td>
            </tr>
          `).join("")}
        </table>
        <div class="meta" style="margin-top:6px">Columns with all-zero values across the month are hidden.</div>
      </div>
    </details>`;
}

// Render the "Row 2 — Build-Up" section: five formula lines that show how each
// monthly figure was assembled from the per-date data (weeks with zero faded).
function renderBuildUp(perDate, monthlyValidation) {
  // Only Sunday/dated rows count as "weeks" for the divisor and components.
  const weekRows = perDate.filter(d => d.date); // rows with a real date
  if (weekRows.length === 0) {
    return `<h2>Row 2 — Build-Up</h2><div class="buildup"><div class="formula muted">No per-date rows available to derive Row 2 from.</div></div>`;
  }

  // Renders a number with the right CSS class so zeros fade out automatically.
  const term = (n, label, isInt = false) => {
    const isZero = !n;
    const display = isInt ? fmtInt(n) : fmt(n);
    return `<span class="${isZero ? "zero" : ""}">${display}<span class="label">${label}</span></span>`;
  };

  const op = (sym) => `<span class="op">${sym}</span>`;

  // Build a "+ + + + +" formula across all weeks for one money column.
  const moneyFormula = (key, isInt = false) => {
    const parts = weekRows.map((d, i) => term(d.money[key], `W${i + 1}`, isInt));
    const total = round2(weekRows.reduce((a, d) => a + d.money[key], 0));
    return `${parts.join(op("+"))} ${op("=")} <span class="result">${isInt ? fmtInt(total) : fmt(total)}</span>`;
  };

  // Per-week attendance subtotals: (M+W+C) per week, divided by week count.
  const attendanceFormula = () => {
    const subtotals = weekRows.map(d => d.attendance.totalCalculated);
    const sum = subtotals.reduce((a, b) => a + b, 0);
    const divisor = weekRows.length;
    const avg = divisor > 0 ? Math.round(sum / divisor) : 0;
    const partsHtml = subtotals.map((s, i) => term(s, `W${i + 1}`, true)).join(op("+"));
    return `(${partsHtml}) ${op("÷")} ${divisor} ${op("=")} ${fmtInt(sum)} ${op("÷")} ${divisor} ${op("=")} <span class="result">${fmtInt(avg)}</span>`;
  };

  const card = (label, formulaHtml, validation, isInt = false) => {
    const reported = validation.reported;
    const recomputed = validation.recomputed;
    const ok = validation.validated;
    const matchHtml = reported == null
      ? `<span class="bad-pill">no reported value to compare</span>`
      : ok
        ? `<span class="pos">✓ matches reported ${isInt ? fmtInt(reported) : fmt(reported)}</span>`
        : `<span class="neg">✗ reported ${isInt ? fmtInt(reported) : fmt(reported)} (Δ ${fmt(Math.abs(reported - recomputed))})</span>`;
    return `
      <div class="buildup">
        <div class="field">${label}</div>
        <div class="formula">${formulaHtml}</div>
        <div class="meta" style="margin-top:6px">${matchHtml}</div>
      </div>`;
  };

  // Tally how many of the 5 build-up entries match their reported value, used for
  // the section badge and to auto-open the section when any are off.
  const buildUpEntries = [
    monthlyValidation.averageAttendance,
    monthlyValidation.offering,
    monthlyValidation.tithe,
    monthlyValidation.thanksgiving,
    monthlyValidation.others,
  ];
  const failedCount = buildUpEntries.filter(v => v && v.reported != null && !v.validated).length;
  const allOk = failedCount === 0;
  const badge = allOk
    ? `<span class="badge good">${buildUpEntries.length} validated</span>`
    : `<span class="badge bad">${failedCount} failed</span>`;

  return `
    <details class="section" data-section-id="buildup" data-has-errors="${!allOk}" ${allOk ? "" : "open"}>
      <summary>Row 2 — Build-Up <span class="badge">how each figure was assembled</span> ${badge}</summary>
      <div class="body">
        ${card("Monthly Average Attendance", attendanceFormula(), monthlyValidation.averageAttendance, true)}
        ${card("Total Offering", moneyFormula("offering"), monthlyValidation.offering)}
        ${card("Total Tithe", moneyFormula("tithe"), monthlyValidation.tithe)}
        ${card("Total Thanksgiving", moneyFormula("thanksgiving"), monthlyValidation.thanksgiving)}
        ${card("Total Others", moneyFormula("others"), monthlyValidation.others)}
      </div>
    </details>
  `;
}

// Cleaner Per-Date Detail: hide all-zero rows (typically blank midweek entries),
// drop empty cells (— instead of "0"), and surface a tidy "X hidden" footer.
function renderPerDateDetail(perDate) {
  const visible = perDate.filter(d => d.hasAttendance || d.hasMoney);
  const hidden = perDate.length - visible.length;

  // Only show columns that have at least one non-zero value across the visible rows.
  const showAttendance = visible.some(d => d.hasAttendance);
  const showMoney = visible.some(d => d.hasMoney);

  if (visible.length === 0) {
    return `<h2>Per-Date Detail</h2>
      <table><tr><td>No dated rows with values were found.</td></tr></table>`;
  }

  const cell = (n, isInt = false) => n === 0 || n == null
    ? `<td class="num muted">—</td>`
    : `<td class="num">${isInt ? fmtInt(n) : fmt(n)}</td>`;

  const header = `
    <tr>
      <th>Date</th>
      <th>Day</th>
      ${showAttendance ? `<th class="num">Men</th><th class="num">Women</th><th class="num">Children</th><th class="num">Att.</th><th class="flag">Match</th>` : ""}
      ${showMoney ? `<th class="num">Offering</th><th class="num">Tithe</th><th class="num">Tnx</th><th class="num">Others</th><th class="num">€ Total</th><th class="flag">Match</th>` : ""}
    </tr>`;

  const body = visible.map(d => `
    <tr>
      <td>${d.date || "—"}</td>
      <td>${d.day || "—"}</td>
      ${showAttendance ? `
        ${cell(d.attendance.men, true)}
        ${cell(d.attendance.women, true)}
        ${cell(d.attendance.children, true)}
        ${d.attendance.totalReported != null && d.hasAttendance ? `<td class="num">${fmtInt(d.attendance.totalReported)}</td>` : `<td class="num muted">—</td>`}
        <td class="flag">${perDateFlag(d.attendance.validated, d.hasAttendance)}</td>
      ` : ""}
      ${showMoney ? `
        ${cell(d.money.offering)}
        ${cell(d.money.tithe)}
        ${cell(d.money.thanksgiving)}
        ${cell(d.money.others)}
        ${d.money.totalReported != null && d.hasMoney ? `<td class="num">${fmt(d.money.totalReported)}</td>` : `<td class="num muted">—</td>`}
        <td class="flag">${perDateFlag(d.money.validated, d.hasMoney)}</td>
      ` : ""}
    </tr>
  `).join("");

  const footer = hidden > 0
    ? `<div class="meta">${hidden} empty midweek row${hidden === 1 ? "" : "s"} hidden.</div>`
    : "";

  return `
    <h2>Per-Date Detail (${visible.length} ${visible.length === 1 ? "row" : "rows"})</h2>
    <table>
      <thead>${header}</thead>
      ${body}
    </table>
    ${footer}`;
}

// Build the full list of comparisons so the summary can grade everything in one place.
// `tol` overrides the default 0.01 epsilon used by gradeChecks (e.g., averages tolerate 0.05).
function buildChecks(r) {
  const mk = (section, label, calc, actual, tol) => ({ section, label, calc, actual, tol });
  const AVG_TOL = 0.05; // matches the field-level tolerance for averages
  const checks = [
    // Row 2 — monthly totals re-summed from per-date data
    mk("Parish Records", "Total Offering (re-summed from per-date)", r.monthlyValidation.offering.recomputed, r.monthlyValidation.offering.reported),
    mk("Parish Records", "Total Tithe (re-summed from per-date)", r.monthlyValidation.tithe.recomputed, r.monthlyValidation.tithe.reported),
    mk("Parish Records", "Total Thanksgiving (re-summed from per-date)", r.monthlyValidation.thanksgiving.recomputed, r.monthlyValidation.thanksgiving.reported),
    mk("Parish Records", "Total Others (re-summed from per-date)", r.monthlyValidation.others.recomputed, r.monthlyValidation.others.reported),
    mk("Parish Records", "Sum (re-summed from per-date)", r.monthlyValidation.sum.recomputed, r.monthlyValidation.sum.reported),
  ];
  if (r.monthlyValidation.averageAttendance.reported != null) {
    checks.push(mk("Parish Records", "Average Attendance (re-derived from per-date)", r.monthlyValidation.averageAttendance.recomputed, r.monthlyValidation.averageAttendance.reported, AVG_TOL));
  }
  // Per-demographic averages
  for (const k of ["averageMen", "averageWomen", "averageChildren"]) {
    const v = r.monthlyValidation[k];
    if (v.reported != null) {
      checks.push(mk("Parish Records", `${k.replace("average", "Average ")} (re-derived from per-date)`, v.recomputed, v.reported, AVG_TOL));
    }
  }
  // Per-WEEK money totals
  for (const wt of r.weeklyTotals) {
    if (wt.enteredTotal != null) {
      checks.push(mk("Weekly Totals", `WEEK ${wt.weekIndex} € Total`, wt.recomputedTotal, wt.enteredTotal));
    }
  }
  // Allocation reconciliation
  checks.push(mk("Allocation Reconciliation", "Sum of all entered remittances = Total income (excl. Others)",
    r.allocationReconciliation.expectedAllocations, r.allocationReconciliation.enteredAllocations));
  // Statistics columns (only those with reported values or recomputed > 0)
  for (const s of r.statistics.validation) {
    if (s.reported != null) {
      checks.push(mk("Statistics", `${s.label} (per-date sum vs Total row)`, s.recomputed, s.reported));
    }
  }
  // Per-date row arithmetic (each dated row): attendance and money internal sums
  for (const d of r.perDate) {
    const tag = `${d.date || `(no date, row ${d.row})`} ${d.day || ""}`.trim();
    if (d.attendance.totalReported != null && d.hasAttendance) {
      checks.push(mk("Per-Date Attendance", `${tag} — Men+Women+Children = Total`, d.attendance.totalCalculated, d.attendance.totalReported));
    }
    if (d.money.totalReported != null && d.hasMoney) {
      checks.push(mk("Per-Date Money", `${tag} — Offering+Tithe+Tnx+Others = Total (€)`, d.money.totalCalculated, d.money.totalReported));
    }
  }
  // Remittance allocation rules (existing)
  checks.push(
    mk("Regional Remittance", "5% of Total Offering", r.regionalRemittance.calculated.offering5, r.regionalRemittance.actual.offering5),
    mk("Regional Remittance", "20% of Total Tithe", r.regionalRemittance.calculated.tithe20, r.regionalRemittance.actual.tithe20),
    mk("Regional Remittance", "Total Regional Remittance", r.regionalRemittance.calculated.total, r.regionalRemittance.actual.total),
    mk("Parish Operations", "55% of Total Tithe", r.parishOperations.calculated.tithe55, r.parishOperations.actual.tithe55),
    mk("Parish Operations", "95% of Total Offering", r.parishOperations.calculated.offering95, r.parishOperations.actual.offering95),
    mk("Parish Operations", "30% of Total Thanksgiving", r.parishOperations.calculated.thanksgiving30, r.parishOperations.actual.thanksgiving30),
    mk("Parish Operations", "Total Parish Operations", r.parishOperations.calculated.total, r.parishOperations.actual.total),
    mk("Pastor Allowance", "20% of Total Tithe", r.parishPastorAllowance.calculated.tithe20, r.parishPastorAllowance.actual.tithe20),
    mk("Pastor Allowance", "70% of Total Thanksgiving", r.parishPastorAllowance.calculated.thanksgiving70, r.parishPastorAllowance.actual.thanksgiving70),
    mk("Pastor Allowance", "Total Pastor Allowance", r.parishPastorAllowance.calculated.total, r.parishPastorAllowance.actual.total),
    mk("Provincial Remittance", "5% of Total Tithe", r.provincialRemittance.calculated.tithe5, r.provincialRemittance.actual.tithe5),
  );
  return checks;
}

function gradeChecks(checks) {
  const validated = [], notValidated = [], missing = [];
  for (const c of checks) {
    if (c.actual == null) { missing.push(c); continue; }
    const tol = c.tol ?? 0.01;
    if (Math.abs(c.calc - c.actual) < tol) validated.push(c);
    else notValidated.push(c);
  }
  return { validated, notValidated, missing, total: checks.length };
}

// Parse a formula-issue message like
//   "Parish Ops 55% of Tithe: file uses 60% instead of canonical 55%"
// into structured pieces so we can render rate badges instead of raw text.
function parseFormulaIssue(issue) {
  const m = (issue.message || "").match(/^(.+?):\s*file uses (\d+)%\s*instead of canonical (\d+)%$/i);
  if (!m) return { rule: issue.message, fileRate: null, canonicalRate: null, detail: issue.detail };
  return { rule: m[1].trim(), fileRate: Number(m[2]), canonicalRate: Number(m[3]), detail: issue.detail };
}

// Render ONE warning variant. Used three times for the comparison view.
function renderTemplateWarningVariant(t, variant, label) {
  const structuralCount = t.structuralIssues.length;
  const formulaCount = t.formulaIssues.length;
  const parts = [
    structuralCount ? `${structuralCount} structural issue${structuralCount === 1 ? "" : "s"}` : null,
    formulaCount ? `${formulaCount} formula error${formulaCount === 1 ? "" : "s"}` : null,
  ].filter(Boolean).join(" · ");

  const formulaIssuesHtml = t.formulaIssues.map(raw => {
    const i = parseFormulaIssue(raw);
    if (i.fileRate != null && i.canonicalRate != null) {
      return `
        <div class="issue">
          <div class="issue-title">${escapeHtml(i.rule)}</div>
          <div class="rate-badges">
            <span class="rate-badge bad">${i.fileRate}%</span>
            <span class="rate-arrow">→ should be</span>
            <span class="rate-badge good">${i.canonicalRate}%</span>
          </div>
          ${i.detail ? `<div class="issue-meta">${escapeHtml(i.detail)}</div>` : ""}
        </div>`;
    }
    return `<div class="issue"><div class="issue-title">${escapeHtml(raw.message)}</div>${raw.detail ? `<div class="issue-meta">${escapeHtml(raw.detail)}</div>` : ""}</div>`;
  }).join("");

  const structuralIssuesHtml = t.structuralIssues.map(i => `
    <div class="issue">
      <div class="issue-title">${escapeHtml(i.message)}</div>
      ${i.detail ? `<div class="issue-meta">${escapeHtml(i.detail)}</div>` : ""}
    </div>
  `).join("");

  return `
    <div class="tw ${variant}">
      ${label ? `<div class="variant-label">${escapeHtml(label)}</div>` : ""}
      <header>
        <div class="icon-circle">${icon(variant === "critical" ? "x-circle" : variant === "amber" ? "alert-triangle" : "info", "size-24 no-offset")}</div>
        <div>
          <div class="title">This report uses an outdated template</div>
          <div class="subtitle">Detected ${parts}. The file's built-in formulas don't match the current rules, so we can't trust the values it produces. Re-export with the current template and upload again.</div>
        </div>
      </header>

      ${formulaCount > 0 ? `
        <div class="detail-card">
          <div class="detail-label">Formula errors detected</div>
          ${formulaIssuesHtml}
        </div>` : ""}

      ${structuralCount > 0 ? `
        <div class="detail-card">
          <div class="detail-label">Structural issues</div>
          ${structuralIssuesHtml}
        </div>` : ""}

      <div class="actions">
        <a class="btn btn-primary" href="${escapeHtml(CORRECT_TEMPLATE_URL)}" target="_blank" rel="noopener">${icon("download")} Get the correct template</a>
        <button class="btn btn-secondary" data-action="reset-upload">Try another file</button>
      </div>
    </div>
  `;
}

function renderTemplateBanner(t) {
  if (!t || t.valid) return "";
  return renderTemplateWarningVariant(t, "amber", null);
}

// Sub-classify a failed check. Returns one of:
//   "forgot-to-total"   — totals cell is blank/0, per-date data exists      (auto-fixable when non-monetary)
//   "wrong-arithmetic"  — both exist but disagree                           (manual review)
//   "wrong-allocation"  — entered remittance ≠ canonical %                  (manual review)
//   "missing-entry"     — totals exist, per-date blank                      (manual review)
//   "template-defect"   — file's built-in formula uses wrong rate           (manual review, surfaced by template banner)
//   "rounding"          — within tolerance after generous rounding          (warn only)
function classifyFailure(check, report) {
  // Calculated > 0 and actual is null/0 → forgot-to-total.
  const calc = Number(check.calc) || 0;
  const actual = check.actual == null ? null : Number(check.actual);

  // Template defect: the related percentage rule was flagged in the template-validity check.
  if (report && report.templateValidity && report.templateValidity.formulaIssues.length) {
    const checkLabel = `${check.section} ${check.label}`.toLowerCase();
    for (const issue of report.templateValidity.formulaIssues) {
      const tokens = issue.message.toLowerCase().match(/\d+%\s*of\s*\w+/);
      if (tokens && checkLabel.includes(tokens[0])) return "template-defect";
    }
  }

  // Wrong allocation: any failure in a remittance section that isn't a template defect.
  if (/regional remittance|parish operations|pastor allowance|provincial remittance|allocation reconciliation/i.test(check.section)) {
    return "wrong-allocation";
  }

  // Missing entry: totals exist, per-date sum is 0.
  if (actual != null && actual !== 0 && calc === 0) return "missing-entry";

  // Forgot-to-total: per-date sum > 0, totals cell is null or 0.
  if (calc > 0 && (actual == null || actual === 0)) return "forgot-to-total";

  // Otherwise: both exist but disagree.
  return "wrong-arithmetic";
}

// Look up severity for a failed check. Per-LABEL overrides win over per-SECTION.
function severityForCheck(check) {
  for (const entry of LABEL_SEVERITY) {
    if (entry.pattern.test(check.label)) return entry.severity;
  }
  return FIELD_SEVERITY[check.section] || FIELD_SEVERITY._default;
}

// True only when an issue is safe to auto-fix:
//   - Sub-type is "forgot-to-total" (parser knows the right value)
//   - Field is non-monetary (severity is warn or info)
//   - We have a cell address to write to
function isAutoFixable(failure) {
  if (failure.subType !== "forgot-to-total") return false;
  if (failure.severity === "fail") return false; // money fields never auto-fix
  if (!failure.cellAddress) return false;
  return true;
}

// Resolve cell address for a check. The Statistics validation entries carry cellAddress
// directly; future fields can register their address here.
function cellAddressForCheck(check, report) {
  if (check.section === "Statistics" && report && report.statistics) {
    const match = report.statistics.validation.find(s => check.label.toLowerCase().startsWith(s.label.toLowerCase()));
    if (match && match.cellAddress) return match.cellAddress;
  }
  return null;
}

// Plain-language title + explanation + suggested fix for one failed check.
// Returns { title, explanation, fixText } — friendly, jargon-free, no math symbols.
// Numbers in count fields (Births, Converts, etc.) render as integers (5, not 5.00);
// money fields keep 2 decimals (€1,070.00).
function explainFailure(failure, report) {
  const { check, subType } = failure;
  const fieldName = check.label.replace(/\s*\([^)]*\)\s*$/, "").replace(/^Total\s+/, "").trim();
  const f = formatterForCheck(check);

  switch (subType) {
    case "forgot-to-total": {
      const contributors = check.section === "Statistics"
        ? statisticsContributors(check, report)
        : null;
      const total = f(check.calc);
      const reported = f(check.actual ?? 0);
      const cellRef = failure.cellAddress ? `cell ${failure.cellAddress}` : "the totals row";

      let explanation;
      if (contributors && contributors.length) {
        const entryCount = contributors.length;
        const friendlyList = friendlyJoin(contributors.map(c => `${c.value} on ${c.date}`));
        explanation = `${entryCount} ${entryCount === 1 ? "entry" : "entries"} this month — ${friendlyList} — ` +
          `for a total of ${total}. But ${cellRef} shows ${reported}. ` +
          `Likely the preparer added ${fieldName} to the weekly rows but forgot to update the totals row.`;
      } else {
        explanation = `The weekly entries add up to ${total}, but ${cellRef} shows ${reported}. ` +
          `Likely the totals row was never updated.`;
      }

      return {
        title: `The "${fieldName}" total wasn't updated`,
        explanation,
        fixText: failure.cellAddress
          ? `Set ${failure.cellAddress} to ${total}`
          : `Update the ${fieldName} total to ${total}`,
      };
    }
    case "wrong-arithmetic": {
      const calculated = f(check.calc);
      const reported = f(check.actual);
      const cellRef = failure.cellAddress ? `cell ${failure.cellAddress}` : "the totals row";
      return {
        title: `The "${fieldName}" totals don't agree`,
        explanation: `Adding the weekly entries gives ${calculated}, but ${cellRef} shows ${reported}. ` +
                     `Either some weekly entries are missing, or the totals row is incorrect. Please review.`,
        fixText: `Please review the file and re-upload.`,
      };
    }
    case "wrong-allocation": {
      const expected = f(check.calc);
      const actual = f(check.actual ?? 0);
      const delta = f(Math.abs(check.calc - (check.actual ?? 0)));
      return {
        title: `${fieldName} amount doesn't match the rule`,
        explanation: `Based on the canonical rules, this should be ${expected}, but the file has ${actual} ` +
                     `(a difference of ${delta}). This affects how money is allocated.`,
        fixText: `Please review the values in the spreadsheet, correct them, and re-upload.`,
      };
    }
    case "missing-entry": {
      return {
        title: `"${fieldName}" total has a value but no weekly entries`,
        explanation: `The totals row shows ${f(check.actual)}, but no weekly rows have any ${fieldName} values. ` +
                     `The per-date entries may have been deleted.`,
        fixText: `Please review and re-upload.`,
      };
    }
    case "template-defect": {
      return {
        title: `${fieldName} is affected by a template defect`,
        explanation: `The file's built-in formula uses the wrong rate. See the outdated-template banner above.`,
        fixText: `Re-export with the current template.`,
      };
    }
    default:
      return {
        title: `${check.section} — ${check.label}`,
        explanation: `Calculated ${f(check.calc)}, file has ${f(check.actual)}.`,
        fixText: `Please review and re-upload.`,
      };
  }
}

// Return contributing per-date entries for a Statistics field as structured objects:
// [{ date: "April 11", value: 3 }, { date: "April 18", value: 2 }] — for friendly rendering.
function statisticsContributors(check, report) {
  if (!report || !report.statistics || !report.statistics.perDate) return null;
  const labelLower = check.label.toLowerCase();
  const statField = STAT_FIELDS.find(f => labelLower.startsWith(f.label.toLowerCase()));
  if (!statField) return null;
  return report.statistics.perDate
    .filter(d => (d.stats[statField.key] || 0) > 0)
    .map(d => ({
      date: formatLongDate(d.date) || `row ${d.row}`,
      value: d.stats[statField.key],
    }));
}

// "Apr 11" → "April 11" (full month name, no year, no zero-padding on day).
function formatLongDate(yyyymmdd) {
  if (!yyyymmdd) return null;
  const m = yyyymmdd.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return yyyymmdd;
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  return `${months[Number(m[2]) - 1]} ${Number(m[3])}`;
}

// Join an array of strings with commas + "and" — natural language list:
//   ["a"]           → "a"
//   ["a", "b"]      → "a and b"
//   ["a", "b", "c"] → "a, b, and c"
function friendlyJoin(items) {
  if (!items || items.length === 0) return "";
  if (items.length === 1) return items[0];
  if (items.length === 2) return `${items[0]} and ${items[1]}`;
  return items.slice(0, -1).join(", ") + ", and " + items[items.length - 1];
}

function formatShortDate(yyyymmdd) {
  if (!yyyymmdd) return null;
  const m = yyyymmdd.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return yyyymmdd;
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${months[Number(m[2]) - 1]} ${Number(m[3])}`;
}

// Take a raw failed check from gradeChecks and enrich it into a "Failure" object
// with sub-type, severity, cellAddress, autoFixable flag, and pre-rendered text.
function buildFailure(check, report) {
  const subType = classifyFailure(check, report);
  const severity = severityForCheck(check);
  const cellAddress = cellAddressForCheck(check, report);
  const failure = { check, subType, severity, cellAddress };
  failure.autoFixable = isAutoFixable(failure);
  Object.assign(failure, explainFailure(failure, report));
  return failure;
}

// Group every validation check into one of three user-facing categories. Used by
// the compact summary so the user sees "12 monetary checks · 8 remittance · 12 statistics"
// instead of a raw count of all 45 checks.
function categorizeChecks(checks) {
  const buckets = { monetary: [], remittance: [], statistics: [], other: [] };
  for (const c of checks) {
    const tag = `${c.section} ${c.label}`.toLowerCase();
    if (/regional remittance|parish operations|pastor allowance|provincial remittance|allocation reconciliation/i.test(c.section)) {
      buckets.remittance.push(c);
    } else if (c.section === "Statistics") {
      buckets.statistics.push(c);
    } else if (/money|offering|tithe|thanksgiving|others|sum|weekly totals|per-date money|parish records/i.test(tag)) {
      buckets.monetary.push(c);
    } else {
      buckets.other.push(c);
    }
  }
  return buckets;
}

// Compact-summary view: shown when the report is 100% clean. Three checklist rows
// (Monetary / Remittance / Statistics) plus a "Show full report" button.
function renderCompactSummary(report, grade) {
  const buckets = categorizeChecks(grade.validated);
  const parishName = report.source.parish || "this parish";
  const pastor = report.source.pastor;
  const reportMonth = report.source.reportMonth || "the report period";

  // Subtitle weaves Pastor and Parish together: "Pastor X at Parish Y · 46 checks passed"
  const subtitleParts = [];
  if (pastor) subtitleParts.push(`${escapeHtml(pastor)} at ${escapeHtml(parishName)}`);
  else if (parishName !== "this parish") subtitleParts.push(escapeHtml(parishName));
  subtitleParts.push(`all ${grade.validated.length} validation checks passed`);
  const subtitle = subtitleParts.join(" · ");

  const row = (label, count, detail) => `
    <div class="compact-row">
      <div class="check">${icon("check-circle-2", "size-20 no-offset")}</div>
      <div class="row-label">${escapeHtml(label)}</div>
      <div class="row-detail">${count} ${count === 1 ? "check" : "checks"} passed${detail ? ` · ${escapeHtml(detail)}` : ""}</div>
    </div>`;

  return `
    <div class="compact-summary">
      <div class="compact-header">
        <div class="compact-icon">${icon("check-circle-2", "size-32 no-offset")}</div>
        <div>
          <div class="compact-title">Everything checks out for ${escapeHtml(reportMonth)} Report</div>
          <div class="compact-subtitle">${subtitle}</div>
        </div>
      </div>
      <div class="compact-checklist">
        ${row("Monetary", buckets.monetary.length, "Offering, Tithe, Thanksgiving, Others")}
        ${row("Remittance", buckets.remittance.length, "Regional, Parish Ops, Pastor, Provincial")}
        ${row("Statistics", buckets.statistics.length, "Attendance, Births, Marriages, Workers, etc.")}
      </div>
      <div class="compact-actions">
        <button class="compact-btn" data-action="submit-report">Submit your report ${icon("arrow-right", "size-14")}</button>
        <button class="compact-btn compact-btn-secondary" data-action="show-full-report">Show full report</button>
      </div>
    </div>
  `;
}

// Hook up the buttons inside the compact summary.
function wireCompactSummaryActions(report) {
  document.querySelectorAll('[data-action="show-full-report"]').forEach(btn => {
    btn.addEventListener("click", () => {
      SHOW_FULL_REPORT_FORCED = true;
      render(report);
    });
  });
  document.querySelectorAll('[data-action="submit-report"]').forEach(btn => {
    btn.addEventListener("click", () => {
      submitReport(report, btn);
    });
  });
  document.querySelectorAll('[data-action="reset-upload"]').forEach(btn => {
    btn.addEventListener("click", () => {
      $("#report").innerHTML = "";
      $("#errors").innerHTML = "";
      $("#filename").textContent = "";
      $("#file").click();
    });
  });
}

// Mock submit: in the prototype this just shows a confirmation card. When the database
// integration is ready, replace this body with a fetch() POST to the persistence endpoint.
async function submitReport(report, btn) {
  if (btn) {
    btn.disabled = true;
    btn.textContent = "Submitting…";
  }
  // Simulate a small network delay so the UX feels real.
  await new Promise(resolve => setTimeout(resolve, 400));
  const submittedAt = new Date();
  $("#report").innerHTML = renderFixesLog() + renderSubmitConfirmation(report, submittedAt);
  wireLucideIcons();
  // Wire up the "Submit another report" button on the confirmation card.
  document.querySelectorAll('[data-action="reset-upload"]').forEach(b => {
    b.addEventListener("click", () => {
      $("#report").innerHTML = "";
      $("#errors").innerHTML = "";
      $("#filename").textContent = "";
      $("#file").click();
    });
  });
}

// Render the "Fixes Applied" log at the top of the report. Returns "" when no fixes
// have been applied this session. Persists across re-renders within the session.
function renderFixesLog() {
  if (!SESSION_FIXES.length) return "";
  const fmtTime = (d) => d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const fmtVal = (v) => v == null ? "(blank)" : String(v);
  return `
    <div class="fixes-log">
      <div class="log-title">
        <span>✓ Fixes applied this session</span>
        <span class="count">${SESSION_FIXES.length}</span>
      </div>
      ${SESSION_FIXES.map(f => `
        <div class="log-row">
          <span class="log-time">${fmtTime(f.appliedAt)}</span>
          <div class="log-detail">
            <strong>${escapeHtml(f.field)}</strong>
            <span class="log-cell">${escapeHtml(f.cellAddress)}</span>
          </div>
          <div class="log-change">
            <span class="old">${escapeHtml(fmtVal(f.oldValue))}</span>
            <span class="arrow">→</span>
            <span class="new">${escapeHtml(fmtVal(f.newValue))}</span>
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

function renderSummary(grade, report) {
  const { validated, notValidated, missing, total } = grade;
  const allOk = notValidated.length === 0 && missing.length === 0;

  // Build rich Failure objects (with severity, sub-type, cell address, auto-fix flag, and pre-rendered text).
  const failures = notValidated.map(c => buildFailure(c, report));
  // Stash globally so click handlers can resolve failures by index.
  CURRENT_FAILURES = failures;

  // Banner color reflects the WORST severity present. If only "warn" failures exist, the banner is amber, not red.
  const severityRank = { fail: 3, warn: 2, info: 1 };
  const worstSev = failures.reduce((s, f) => severityRank[f.severity] > severityRank[s] ? f.severity : s, "info");
  const cls = allOk ? "ok" : worstSev === "fail" ? "bad" : "partial";
  const bannerIcon = allOk ? icon("check-circle-2", "size-18") : worstSev === "fail" ? icon("x-circle", "size-18") : icon("alert-triangle", "size-18");

  const failCount = failures.filter(f => f.severity === "fail").length;
  const warnCount = failures.filter(f => f.severity === "warn").length;
  const sevBreakdown = (failCount > 0 && warnCount > 0)
    ? ` (${failCount} fail · ${warnCount} warn)`
    : "";

  const title = allOk
    ? `All ${total} checks validated`
    : `${notValidated.length} of ${total} checks failed validation${sevBreakdown}`;

  // Render each failure as a rich card.
  const failureCardsHtml = failures.length === 0 ? "" : `
    <div class="failure-list">
      ${failures.map((f, idx) => renderFailureCard(f, idx)).join("")}
    </div>`;

  // Missing fields stay as a small list (not a full failure card — they're informational).
  const missingHtml = missing.length === 0 ? "" : `
    <div class="summary-detail">
      <ul>
        ${missing.map(c => `<li><span class="check-tag preparer">missing</span><strong>${c.section}</strong> · ${c.label} — calculated <code>${fmt(c.calc)}</code>, actual value not found in file</li>`).join("")}
      </ul>
    </div>`;

  return `
    <div class="summary ${cls}">
      <div>
        <div class="title">${bannerIcon} ${title}</div>
        <div class="stats">${validated.length} validated · ${notValidated.length} failed · ${missing.length} missing</div>
      </div>
      ${failureCardsHtml}
      ${missingHtml}
    </div>`;
}

// Render one failure as THREE stacked layout variants (A/B/C) so the user can
// pick visually. Once a layout is chosen we'll keep only one renderer.
// All three variants share: cell-address-as-subject header, refined sub-type chip,
// no severity chip (color carries severity), no em dashes, integers without decimals.
function renderFailureCard(failure, idx) {
  // Pull the structured contributing entries (used by Layout A and the source line in B/C).
  const entries = failure.check.section === "Statistics"
    ? (statisticsContributors(failure.check, CURRENT_REPORT) || [])
    : [];
  const f = formatterForCheck(failure.check);
  const correctValue = f(failure.check.calc);
  const currentValue = f(failure.check.actual ?? 0);
  // Field name without the parenthetical suffix that's there for engineering clarity.
  const fieldName = failure.check.label.replace(/\s*\([^)]*\)\s*$/, "").replace(/^Total\s+/, "").trim();
  // Subject header: cell address + field name.
  const cellChip = failure.cellAddress
    ? `<span class="cell-ref" data-cell="${failure.cellAddress}" title="Click to copy ${failure.cellAddress}">${failure.cellAddress}</span>`
    : "";
  const subjectText = failure.cellAddress
    ? `${cellChip}${escapeHtml(fieldName)} total`
    : `${escapeHtml(fieldName)} total`;
  // Sub-type chip — sentence case, friendlier wording.
  const subTypeLabel = ({
    "forgot-to-total": "Totals row not updated",
    "wrong-arithmetic": "Totals don't match",
    "wrong-allocation": "Allocation rule not met",
    "missing-entry": "Missing weekly entries",
    "template-defect": "Outdated template",
  })[failure.subType] || failure.subType;
  const subjectHeader = `
    <div class="card-subject">
      <div class="subject-text">${subjectText}</div>
      <span class="subtype-chip">${escapeHtml(subTypeLabel)}</span>
    </div>`;
  // Cause line.
  const causeLine = failure.subType === "forgot-to-total"
    ? `<div class="card-cause">the totals row wasn't refreshed after weekly entries were added.</div>`
    : "";
  // Fix CTA (shared across all variants).
  const fixBtn = failure.autoFixable
    ? `<button class="fix-btn" data-fix-idx="${idx}">${icon("check")} Fix this for me — Set ${failure.cellAddress} to ${correctValue}</button>`
    : `<span class="fix-text">${escapeHtml(failure.fixText)}</span>`;
  const fixBlock = `
    <div class="card-fix">${fixBtn}</div>
    ${failure.cellAddress ? `<span class="copy-toast" data-toast-for="${failure.cellAddress}">copied!</span>` : ""}`;

  // Source line for the "Should be" row — e.g., "3 on April 11 + 2 on April 18".
  const sourceText = entries.length
    ? entries.map(e => `${e.value} on ${e.date}`).join(" + ")
    : "weekly entries";

  return `
    <div class="failure-card ${failure.severity} layout-c" data-failure-idx="${idx}">
      ${subjectHeader}
      <div class="card-headline">The ${escapeHtml(fieldName)} total needs to be updated.</div>
      <ul class="compare-list">
        <li>
          <span class="li-label">Currently</span>
          <span><span class="li-value">${currentValue}</span></span>
        </li>
        <li>
          <span class="li-label">Should be</span>
          <span><span class="li-value">${correctValue}</span><span class="li-source">${escapeHtml(sourceText)}</span></span>
        </li>
      </ul>
      ${causeLine}
      ${fixBlock}
    </div>
  `;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Render a Lucide icon as an inline marker. The lucide.createIcons() call
// (run after each render via wireLucideIcons) replaces these <i> tags with SVGs.
// `name` = lucide icon name (e.g., "check-circle-2", "alert-triangle").
// `extra` = optional class names or attributes (e.g., "size-16").
function icon(name, extra = "") {
  const cls = `lucide-icon ${extra}`.trim();
  return `<i data-lucide="${name}" class="${cls}"></i>`;
}

// Replace all <i data-lucide="..."> markers in #report with actual SVGs.
// Must be called after every render that adds icons to the DOM.
function wireLucideIcons() {
  if (typeof lucide !== "undefined" && lucide.createIcons) {
    lucide.createIcons();
  }
}

// ---- Auto-fix: patch a cell in the in-memory workbook and re-validate ----
// No download, no re-upload. The original .xlsx on disk is untouched; the corrected
// values flow straight into the report shown on screen. Fixes are logged in
// SESSION_FIXES so the user can audit what was changed.
function applyPatchAndRevalidate(failure) {
  if (!CURRENT_FILE.workbook) {
    alert("Source workbook is no longer available. Please re-upload.");
    return;
  }
  if (!failure.cellAddress) {
    alert("This issue can't be auto-fixed (no cell address tracked).");
    return;
  }
  const wb = CURRENT_FILE.workbook;
  const sheet = wb.Sheets[CURRENT_FILE.sheetName];
  if (!sheet) {
    alert(`Sheet "${CURRENT_FILE.sheetName}" not found in workbook.`);
    return;
  }
  const newValue = Number(failure.check.calc);
  if (!isFinite(newValue)) {
    alert(`Calculated value is not a number: ${failure.check.calc}`);
    return;
  }

  const oldValue = failure.check.actual;
  const confirmMsg = `Apply this fix in the current session?\n\n` +
    `Field: ${failure.check.label}\n` +
    `Cell: ${failure.cellAddress}\n` +
    `Current value: ${oldValue ?? "(blank)"}\n` +
    `New value: ${newValue}\n\n` +
    `The report will be re-validated immediately. Your original file on disk is NOT modified.`;
  if (!confirm(confirmMsg)) return;

  // Patch the cell in the in-memory sheet object.
  const existing = sheet[failure.cellAddress];
  sheet[failure.cellAddress] = {
    ...existing,
    t: "n",
    v: newValue,
    w: undefined, // clear cached display string so SheetJS re-formats
    f: undefined, // clear formula if any (we're hardcoding the value)
  };

  // Log the fix.
  SESSION_FIXES.push({
    appliedAt: new Date(),
    cellAddress: failure.cellAddress,
    field: failure.check.label,
    section: failure.check.section,
    oldValue: oldValue,
    newValue: newValue,
  });

  // Re-parse the patched workbook and re-render so every section reflects the corrected data.
  const report = parseWorkbook(wb);
  render(report);
}

// Stash the latest list of failures so click handlers can look them up by index.
let CURRENT_FAILURES = [];

// In-session log of every fix that's been applied. Survives re-renders within a session
// (it's a module-level array, not page state). Cleared when a new file is uploaded.
let SESSION_FIXES = [];

// Hook up: per-issue "Fix this for me" buttons + cell-reference copy-to-clipboard.
function wireFailureCardActions() {
  document.querySelectorAll(".fix-btn[data-fix-idx]").forEach(btn => {
    btn.addEventListener("click", () => {
      const idx = Number(btn.dataset.fixIdx);
      const failure = CURRENT_FAILURES[idx];
      if (!failure) return;
      btn.disabled = true;
      try {
        applyPatchAndRevalidate(failure);
      } finally {
        // Note: after re-render the button is replaced; this re-enable mostly matters
        // if the patch was cancelled and the same DOM stays in place.
        setTimeout(() => { btn.disabled = false; }, 500);
      }
    });
  });
  document.querySelectorAll(".cell-ref[data-cell]").forEach(el => {
    el.addEventListener("click", async () => {
      const cell = el.dataset.cell;
      try {
        await navigator.clipboard.writeText(cell);
        const toast = document.querySelector(`.copy-toast[data-toast-for="${cell}"]`);
        if (toast) {
          toast.classList.add("show");
          setTimeout(() => toast.classList.remove("show"), 1200);
        }
      } catch {
        // Clipboard not available — silently no-op
      }
    });
  });
}

function downloadJSON(report) {
  const blob = new Blob([JSON.stringify(report, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `mreport_${(report.source.parish || "report").toString().replace(/\s+/g, "_")}_${report.source.reportMonth.replace(" ", "_")}.json`;
  a.click();
}

function downloadXLSX(r) {
  const wb = XLSX.utils.book_new();
  const rows = [
    ["mReport — Parish Summary"],
    [],
    ["Parish Info"],
    ["Name of Parish", r.source.parish ?? ""],
    ["Month of the Report", r.source.reportMonth],
    ["Name of Pastor", r.source.pastor ?? ""],
    ["Mobile", r.source.mobile ?? ""],
    ["Email", r.source.email ?? ""],
    [],
    ["Parish Records"],
    ["Average Attendance", r.parishRecords.averageAttendance],
    ["Total Offering", r.parishRecords.totalOffering],
    ["Total Tithe", r.parishRecords.totalTithe],
    ["Total Thanksgiving", r.parishRecords.totalThanksgiving],
    ["Total of Others", r.parishRecords.totalOthers],
    ["Sum", r.parishRecords.sum],

    ["Regional Remittance", "Calculated", "Actual", "Match"],

    ["Total Regional Remittance", r.regionalRemittance.calculated.total, r.regionalRemittance.actual.total, matchLabel(r.regionalRemittance.calculated.total, r.regionalRemittance.actual.total)],
    [],
    ["Parish Operations", "Calculated", "Actual", "Match"],
    ["55% of Tithe", r.parishOperations.calculated.tithe55, r.parishOperations.actual.tithe55, matchLabel(r.parishOperations.calculated.tithe55, r.parishOperations.actual.tithe55)],
    ["95% of Offering", r.parishOperations.calculated.offering95, r.parishOperations.actual.offering95, matchLabel(r.parishOperations.calculated.offering95, r.parishOperations.actual.offering95)],
    ["30% of Thanksgiving", r.parishOperations.calculated.thanksgiving30, r.parishOperations.actual.thanksgiving30, matchLabel(r.parishOperations.calculated.thanksgiving30, r.parishOperations.actual.thanksgiving30)],
    ["Total Parish Operations", r.parishOperations.calculated.total, r.parishOperations.actual.total, matchLabel(r.parishOperations.calculated.total, r.parishOperations.actual.total)],
    [],
    ["Parish Pastor Allowance", "Calculated", "Actual", "Match"],
    ["20% of Tithe", r.parishPastorAllowance.calculated.tithe20, r.parishPastorAllowance.actual.tithe20, matchLabel(r.parishPastorAllowance.calculated.tithe20, r.parishPastorAllowance.actual.tithe20)],
    ["70% of Thanksgiving", r.parishPastorAllowance.calculated.thanksgiving70, r.parishPastorAllowance.actual.thanksgiving70, matchLabel(r.parishPastorAllowance.calculated.thanksgiving70, r.parishPastorAllowance.actual.thanksgiving70)],
    ["Total Parish Pastor Allowance", r.parishPastorAllowance.calculated.total, r.parishPastorAllowance.actual.total, matchLabel(r.parishPastorAllowance.calculated.total, r.parishPastorAllowance.actual.total)],
    [],
    ["Provincial Remittance", "Calculated", "Actual", "Match"],
    ["5% of Tithe", r.provincialRemittance.calculated.tithe5, r.provincialRemittance.actual.tithe5, matchLabel(r.provincialRemittance.calculated.tithe5, r.provincialRemittance.actual.tithe5)],
    [],
    ["Others"],
    ["Total Others", r.others.totalOthers],
    [],
    ["Row 2 Validation (re-summed from per-date)", "Reported", "Re-summed", "Match"],
    ["Average Attendance", r.monthlyValidation.averageAttendance.reported, r.monthlyValidation.averageAttendance.recomputed, validationLabel(r.monthlyValidation.averageAttendance.validated)],
    ["Total Offering", r.monthlyValidation.offering.reported, r.monthlyValidation.offering.recomputed, validationLabel(r.monthlyValidation.offering.validated)],
    ["Total Tithe", r.monthlyValidation.tithe.reported, r.monthlyValidation.tithe.recomputed, validationLabel(r.monthlyValidation.tithe.validated)],
    ["Total Thanksgiving", r.monthlyValidation.thanksgiving.reported, r.monthlyValidation.thanksgiving.recomputed, validationLabel(r.monthlyValidation.thanksgiving.validated)],
    ["Total Others", r.monthlyValidation.others.reported, r.monthlyValidation.others.recomputed, validationLabel(r.monthlyValidation.others.validated)],
    ["Sum", r.monthlyValidation.sum.reported, r.monthlyValidation.sum.recomputed, validationLabel(r.monthlyValidation.sum.validated)],
  ];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{ wch: 32 }, { wch: 18 }, { wch: 18 }, { wch: 14 }];
  XLSX.utils.book_append_sheet(wb, ws, "Summary");

  // ---- Per-Date Detail sheet ----
  const detailRows = [
    ["Date", "Day", "Men", "Women", "Children", "Att. Reported", "Att. Calculated", "Att. Match",
     "Offering", "Tithe", "Thanksgiving", "Others", "€ Reported", "€ Calculated", "€ Match"],
    ...r.perDate.map(d => [

      d.day || "",
      d.attendance.men, d.attendance.women, d.attendance.children,
      d.attendance.totalReported ?? "", d.attendance.totalCalculated,
      validationLabel(d.attendance.validated),
      d.money.offering, d.money.tithe, d.money.thanksgiving, d.money.others,
      d.money.totalReported ?? "", d.money.totalCalculated,
      validationLabel(d.money.validated),
    ]),
  ];
  const wsDetail = XLSX.utils.aoa_to_sheet(detailRows);
  wsDetail["!cols"] = [
    { wch: 12 }, { wch: 10 },
    { wch: 6 }, { wch: 7 }, { wch: 9 }, { wch: 13 }, { wch: 14 }, { wch: 11 },
    { wch: 10 }, { wch: 10 }, { wch: 12 }, { wch: 8 }, { wch: 12 }, { wch: 13 }, { wch: 11 },
  ];
  XLSX.utils.book_append_sheet(wb, wsDetail, "Per-Date Detail");

  // ---- Weekly Totals sheet ----
  if (r.weeklyTotals && r.weeklyTotals.length) {
    const wRows = [
      ["Week", "Entered € Total", "Re-summed", "Δ", "Match"],
      ...r.weeklyTotals.map(w => [
        `WEEK ${w.weekIndex}`,
        w.enteredTotal ?? "",
        w.recomputedTotal,
        w.enteredTotal != null ? Math.abs(w.enteredTotal - w.recomputedTotal) : "",
        validationLabel(w.validated),
      ]),
    ];
    const wsW = XLSX.utils.aoa_to_sheet(wRows);
    wsW["!cols"] = [{ wch: 10 }, { wch: 16 }, { wch: 14 }, { wch: 10 }, { wch: 14 }];
    XLSX.utils.book_append_sheet(wb, wsW, "Weekly Totals");
  }

  // ---- Allocation Reconciliation sheet ----
  if (r.allocationReconciliation) {
    const a = r.allocationReconciliation;
    const aRows = [
      ["Allocation Reconciliation"],
      [],
      ["Total monetary income", a.totalIncome],
      ["Others (no allocation rule)", a.others],
      ["Expected allocations (Total − Others)", a.expectedAllocations],
      ["Sum of entered remittances", a.enteredAllocations],
      ["Δ (entered − expected)", a.delta],
      ["Match", validationLabel(a.validated)],
    ];
    const wsA = XLSX.utils.aoa_to_sheet(aRows);
    wsA["!cols"] = [{ wch: 38 }, { wch: 18 }];
    XLSX.utils.book_append_sheet(wb, wsA, "Allocation");
  }

  // ---- Statistics sheet (always include all 12 fields, not just visible ones) ----
  if (r.statistics && r.statistics.validation) {
    const sRows = [
      ["Field", "Per-date sum", "Reported total", "Match"],
      ...r.statistics.validation.map(s => [s.label, s.recomputed, s.reported ?? "", validationLabel(s.validated)]),
    ];
    const wsS = XLSX.utils.aoa_to_sheet(sRows);
    wsS["!cols"] = [{ wch: 20 }, { wch: 14 }, { wch: 16 }, { wch: 14 }];
    XLSX.utils.book_append_sheet(wb, wsS, "Statistics");
  }

  // ---- Sanity Checks sheet ----
  if (r.sanityChecks && r.sanityChecks.length) {
    const sRows = [
      ["Check", "Level", "Detail"],
      ...r.sanityChecks.map(c => [c.label, c.level, c.detail || ""]),
    ];
    const wsCS = XLSX.utils.aoa_to_sheet(sRows);
    wsCS["!cols"] = [{ wch: 40 }, { wch: 8 }, { wch: 60 }];
    XLSX.utils.book_append_sheet(wb, wsCS, "Sanity");
  }

  XLSX.writeFile(wb, `mreport_${(r.source.parish || "report").toString().replace(/\s+/g, "_")}_${r.source.reportMonth.replace(" ", "_")}.xlsx`);
}

function validationLabel(v) {
  if (v == null) return "n/a";
  return v ? "Validated" : "Not validated";
}

function matchLabel(calc, actual) {
  if (actual == null) return "missing";
  return Math.abs(calc - actual) < 0.01 ? "Positive" : "Negative";
}

// ============================================================
//  EVENTS
// ============================================================

const drop = $("#drop");
const fileInput = $("#file");

// On page load: if the URL has ?demo=errors, render the showcase instead of the upload UI.
(function maybeRenderShowcase() {
  const params = new URLSearchParams(window.location.search);
  if (params.get("demo") === "errors") {
    // Defer until DOM/scripts are ready (this script runs at body end so OK as-is).
    setTimeout(() => renderShowcase(), 0);
  }
})();

// NOTE: <label class="drop"> already opens the file picker natively when clicked,
// so we do NOT add a click handler — adding one would open the picker twice.
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("drag"); });
drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
drop.addEventListener("drop", (e) => {
  e.preventDefault();
  drop.classList.remove("drag");
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", (e) => {
  if (e.target.files.length) handleFile(e.target.files[0]);
  // Clear so re-selecting the same file fires `change` again.
  e.target.value = "";
});

function showError(msg) {
  $("#errors").innerHTML = `<div class="err"><strong>Could not parse this file.</strong><br>${escapeHtml(msg)}</div>`;
}

function handleFile(file) {
  $("#errors").innerHTML = "";
  $("#filename").textContent = file.name;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: "array", cellDates: true });
      CURRENT_FILE = { workbook: wb, filename: file.name, sheetName: wb.SheetNames[0] };
      // Each new file starts with a clean fix log — fixes don't carry over between files.
      SESSION_FIXES = [];
      // Reset the "show full report" override so each new file starts in compact mode if clean.
      SHOW_FULL_REPORT_FORCED = false;
      const report = parseWorkbook(wb);
      render(report);
    } catch (err) {
      console.error(err);
      showError(err.message || String(err));
    }
  };
  reader.readAsArrayBuffer(file);
}
